name: publish

on:
  push:
    branches:
      - main
      - prod

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Compute version
        run: echo "REVISION=1.0.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "11"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish
        run: mvn -B -ntp -Drevision=$REVISION deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump container version manifest
        if: github.ref_name == 'prod' && github.actor != 'github-actions[bot]'
        env:
          VERSION: ${{ env.REVISION }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ.get("VERSION")
          if not version:
            raise SystemExit("VERSION not set")

          updates = {
            Path("manifests/register-container-config.yaml"): r'^(\s*VERSION:\s*).*$',
            Path("manifests/register-container-job.yaml"): r'^(\s*rules\.dotcomrow/container-version:\s*).*$',
            Path("manifests/workbench-import-job.yaml"): r'^(\s*rules\.dotcomrow/repo-version:\s*).*$',
          }
          for path, pattern in updates.items():
            text = path.read_text()
            replacement = r'\g<1>"{0}"'.format(version)
            new_text, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
            if count == 0:
              raise SystemExit(f"Pattern not found in {path}")
            if new_text != text:
              path.write_text(new_text)
          PY
          if git diff --quiet; then
            echo "Version already up to date; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/register-container-config.yaml manifests/register-container-job.yaml manifests/workbench-import-job.yaml
          git commit -m "chore: bump container version to ${VERSION} [skip ci]"
          git push origin HEAD:prod
