apiVersion: batch/v1
kind: Job
metadata:
  name: workbench-import-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "25"
    rules.dotcomrow/repo-version: "1.0.71"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: drools-rules-service
      restartPolicy: OnFailure
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kie-workbench
              topologyKey: kubernetes.io/hostname
      containers:
        - name: import
          image: hashicorp/vault:1.15.4
          env:
            - name: HOLD_POD
              value: "false"
          envFrom:
            - configMapRef:
                name: workbench-import-config-tool-use-policy
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              hold_on_error() {
                code=$?
                if [ "$code" -ne 0 ] && [ "${HOLD_POD:-false}" = "true" ]; then
                  echo "Job failed with exit code ${code}; holding pod for debugging..."
                  while true; do sleep 3600; done
                fi
                exit "$code"
              }
              trap hold_on_error EXIT

              cleanup_duplicate_repos() {
                if [ -z "${NIOGIT_ROOT:-}" ] || [ -z "${SPACE_NAME:-}" ] || [ -z "${REPO_NAME:-}" ]; then
                  return 0
                fi
                if [ ! -d "${NIOGIT_ROOT}/${SPACE_NAME}" ]; then
                  echo "WARN: NIOGIT space directory not found: ${NIOGIT_ROOT}/${SPACE_NAME}"
                  return 0
                fi
                for dup in $(find "${NIOGIT_ROOT}/${SPACE_NAME}" -maxdepth 1 -type d -name "${REPO_NAME}-*.git" 2>/dev/null || true); do
                  [ -d "$dup" ] || continue
                  base="$(basename "$dup")"
                  suffix="${base#${REPO_NAME}-}"
                  suffix="${suffix%.git}"
                  if printf '%s' "$suffix" | grep -Eq '^[0-9]+$'; then
                    if rm -rf "$dup"; then
                      echo "Removed duplicate repo dir: ${dup}"
                    else
                      echo "WARN: Failed to remove duplicate repo dir: ${dup}"
                    fi
                  fi
                done
              }
              refresh_project_list() {
                PROJECT_EXISTS="false"
                PROJECT_BODY="$(curl -sS -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/projects" || true)"
                PROJECT_JSON="$(printf '%s' "$PROJECT_BODY" | sed '$d')"
                PROJECT_CODE="$(printf '%s' "$PROJECT_BODY" | tail -n 1)"
                if [ "$PROJECT_CODE" = "200" ]; then
                  if printf '%s' "$PROJECT_JSON" | jq -e --arg name "$REPO_NAME" '
                    if type == "array" then
                      .[] | select(.name == $name or .projectName == $name)
                    elif type == "object" then
                      (.projects // .items // .result // [])[] | select(.name == $name or .projectName == $name)
                    else empty end' >/dev/null 2>&1; then
                    PROJECT_EXISTS="true"
                  fi
                fi
              }
              wait_for_project() {
                attempts="${1:-6}"
                for i in $(seq 1 "$attempts"); do
                  refresh_project_list
                  if [ "$PROJECT_EXISTS" = "true" ]; then
                    return 0
                  fi
                  sleep 2
                done
                return 1
              }

              apk add --no-cache curl jq
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))"
              export VAULT_TOKEN

              WORKBENCH_BASE="${WORKBENCH_BASE:-}"
              SPACE_NAME="${SPACE_NAME:-}"
              SPACE_DESC="${SPACE_DESC:-}"
              DEFAULT_GROUP_ID="${DEFAULT_GROUP_ID:-}"
              REPO_NAME="${REPO_NAME:-}"
              REPO_URL="${REPO_URL:-}"
              SPACE_WAIT_SECONDS="${SPACE_WAIT_SECONDS:-300}"
              SPACE_OWNER="${SPACE_OWNER:-}"
              if [ -z "$WORKBENCH_BASE" ] || [ -z "$SPACE_NAME" ] || [ -z "$SPACE_DESC" ] || [ -z "$DEFAULT_GROUP_ID" ] || [ -z "$REPO_NAME" ] || [ -z "$REPO_URL" ]; then
                echo "ERROR: Missing import config (WORKBENCH_BASE, SPACE_NAME, SPACE_DESC, DEFAULT_GROUP_ID, REPO_NAME, REPO_URL)"
                exit 1
              fi

              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              CONTROLLER_JSON="$(vault kv get -format=json secret/drools/admin)"
              CONTROLLER_USER="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.username // empty')"
              CONTROLLER_PASS="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi
              if [ -z "$CONTROLLER_USER" ] || [ -z "$CONTROLLER_PASS" ]; then
                echo "ERROR: Missing controller credentials in Vault"
                exit 1
              fi
              if [ -z "$SPACE_OWNER" ]; then
                SPACE_OWNER="$CONTROLLER_USER"
              fi

              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN" ]; then
                echo "ERROR: Missing GitHub credentials in Vault"
                exit 1
              fi

              TOKEN_URL="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token"
              TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=${KC_CLIENT_ID}" \
                --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                --data-urlencode "username=${CONTROLLER_USER}" \
                --data-urlencode "password=${CONTROLLER_PASS}" \
                "$TOKEN_URL" || true)"
              TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
              TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
              if [ "$TOKEN_CODE" = "200" ]; then
                TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
              else
                TOKEN=""
              fi
              if [ -z "$TOKEN" ]; then
                TOKEN_ERROR="$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty')"
                TOKEN_ERROR_DESC="$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty')"
                echo "ERROR: Keycloak token request failed: HTTP ${TOKEN_CODE} ${TOKEN_ERROR}${TOKEN_ERROR_DESC:+ - }${TOKEN_ERROR_DESC}"
                exit 1
              fi

              echo "Waiting for Workbench REST API..."
              CODE=""
              SPACES_JSON=""
              for i in $(seq 1 60); do
                SPACES_BODY="$(curl -sS -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_BASE}/rest/spaces" || true)"
                SPACES_JSON="$(printf '%s' "$SPACES_BODY" | sed '$d')"
                CODE="$(printf '%s' "$SPACES_BODY" | tail -n 1)"
                if [ "$CODE" = "200" ]; then
                  break
                fi
                echo "  ...not ready (HTTP ${CODE}); retrying"
                sleep 5
              done
              if [ "$CODE" != "200" ]; then
                echo "ERROR: Workbench REST API not ready (last HTTP ${CODE})"
                exit 1
              fi

              SPACE_PAYLOAD="$(jq -n \
                --arg name "$SPACE_NAME" \
                --arg desc "$SPACE_DESC" \
                --arg gid "$DEFAULT_GROUP_ID" \
                --arg owner "$SPACE_OWNER" \
                '{name:$name, description:$desc, defaultGroupId:$gid, owner:$owner}')"
              SPACE_EXISTS="false"
              if printf '%s' "$SPACES_JSON" | jq -e --arg name "$SPACE_NAME" '
                if type == "array" then
                  .[] | select(.name == $name)
                elif type == "object" then
                  (.spaces // .items // .result // [])[] | select(.name == $name)
                else empty end' >/dev/null 2>&1; then
                SPACE_EXISTS="true"
              fi

              SPACE_RESPONSE="$(mktemp)"
              SPACE_HEADERS="$(mktemp)"
              SPACE_CODE=""
              if [ "$SPACE_EXISTS" = "true" ]; then
                echo "OK: Space already exists: ${SPACE_NAME}"
                SPACE_CODE="409"
              else
                SPACE_CODE="$(curl -sS -D "$SPACE_HEADERS" -o "$SPACE_RESPONSE" -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -X POST "${WORKBENCH_BASE}/rest/spaces" \
                  -d "$SPACE_PAYLOAD" || true)"
              fi
              if [ "$SPACE_CODE" = "201" ] || [ "$SPACE_CODE" = "200" ] || [ "$SPACE_CODE" = "409" ]; then
                echo "OK: Space ready: ${SPACE_NAME}"
              elif [ "$SPACE_CODE" = "202" ]; then
                echo "Space creation accepted; waiting for ${SPACE_NAME} to be ready..."
                echo "Space create response headers:"
                cat "$SPACE_HEADERS"
                echo "Space create response body:"
                cat "$SPACE_RESPONSE"
                echo
                READY_CODE=""
                FOUND="false"
                STEPS=$((SPACE_WAIT_SECONDS / 5))
                if [ "$STEPS" -lt 12 ]; then
                  STEPS=12
                fi
                JOB_URL="$(awk -F': ' 'tolower($1)=="location"{print $2}' "$SPACE_HEADERS" | tr -d '\r')"
                if [ -z "$JOB_URL" ]; then
                  JOB_URL="$(jq -r '.location // .url // .href // empty' "$SPACE_RESPONSE" 2>/dev/null || true)"
                fi
                JOB_ID="$(jq -r '.jobId // .id // .job_id // .jobID // empty' "$SPACE_RESPONSE" 2>/dev/null || true)"
                if [ -n "$JOB_URL" ]; then
                  case "$JOB_URL" in
                    http*) ;;
                    /*) JOB_URL="${WORKBENCH_BASE%/}${JOB_URL}" ;;
                    *) JOB_URL="${WORKBENCH_BASE%/}/$JOB_URL" ;;
                  esac
                elif [ -n "$JOB_ID" ]; then
                  JOB_URL="${WORKBENCH_BASE%/}/rest/jobs/${JOB_ID}"
                fi
                if [ -n "$JOB_URL" ]; then
                  echo "Polling space job: ${JOB_URL}"
                  for i in $(seq 1 "$STEPS"); do
                    JOB_BODY="$(curl -sS -w '\n%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      "$JOB_URL" || true)"
                    JOB_JSON="$(printf '%s' "$JOB_BODY" | sed '$d')"
                    JOB_CODE="$(printf '%s' "$JOB_BODY" | tail -n 1)"
                    if [ "$JOB_CODE" = "200" ]; then
                      JOB_STATUS_RAW="$(printf '%s' "$JOB_JSON" | jq -r '.status // .state // .jobStatus // .result // empty' 2>/dev/null || true)"
                      if [ -n "$JOB_STATUS_RAW" ]; then
                        JOB_STATUS="$(printf '%s' "$JOB_STATUS_RAW" | tr '[:upper:]' '[:lower:]')"
                        echo "Job status: ${JOB_STATUS_RAW}"
                        case "$JOB_STATUS" in
                          *success*|*succeeded*|*done*|*finished*|*completed*)
                            break
                            ;;
                          *fail*|*error*|*bad_request*|*rejected*|*denied*)
                            if printf '%s' "$JOB_JSON" | jq -r '.result // empty' | rg -qi "already exists"; then
                              echo "OK: Space already exists: ${SPACE_NAME}"
                              break
                            fi
                            echo "ERROR: Space job failed"
                            echo "$JOB_JSON"
                            exit 1
                            ;;
                        esac
                      else
                        echo "Job response (first 400 chars):"
                        printf '%s' "$JOB_JSON" | head -c 400 || true
                        echo
                      fi
                    else
                      echo "Job poll returned HTTP ${JOB_CODE}"
                      printf '%s' "$JOB_JSON" | head -c 400 || true
                      echo
                    fi
                    sleep 3
                  done
                fi
                for i in $(seq 1 "$STEPS"); do
                  LIST_BODY="$(curl -sS -w '\n%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    "${WORKBENCH_BASE}/rest/spaces" || true)"
                  LIST_JSON="$(printf '%s' "$LIST_BODY" | sed '$d')"
                  READY_CODE="$(printf '%s' "$LIST_BODY" | tail -n 1)"
                  if [ "$READY_CODE" = "200" ]; then
                    if printf '%s' "$LIST_JSON" | jq -e --arg name "$SPACE_NAME" '
                      if type == "array" then
                        .[] | select(.name == $name)
                      elif type == "object" then
                        (.spaces // .items // .result // [])[] | select(.name == $name)
                      else empty end' >/dev/null 2>&1; then
                      FOUND="true"
                      break
                    fi
                  fi
                  sleep 3
                done
                if [ "$FOUND" = "true" ]; then
                  echo "OK: Space ready: ${SPACE_NAME}"
                else
                  echo "Space list response (first 400 chars):"
                  printf '%s' "$LIST_JSON" | head -c 400 || true
                  echo
                  echo "ERROR: Space not ready after async create (last HTTP ${READY_CODE})"
                  exit 1
                fi
              else
                echo "ERROR: Failed to create space (HTTP ${SPACE_CODE})"
                echo "Response body:"
                cat "$SPACE_RESPONSE"
                exit 1
              fi
              rm -f "$SPACE_RESPONSE" "$SPACE_HEADERS"

              NIOGIT_ROOT="/niogit/.niogit"
              NIOGIT_CANONICAL="false"
              if [ -d "${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}.git" ]; then
                NIOGIT_CANONICAL="true"
              fi
              cleanup_duplicate_repos

              refresh_project_list
              if [ "$PROJECT_CODE" = "200" ]; then
                DUP_NAMES="$(printf '%s' "$PROJECT_JSON" | jq -r --arg base "$REPO_NAME" '
                  def items:
                    if type == "array" then .
                    elif type == "object" then (.projects // .items // .result // [])
                    else [] end;
                  items
                  | .[]?
                  | (.name // .projectName // empty)
                  | select(startswith($base + "-"))
                  | ltrimstr($base + "-") as $suffix
                  | select($suffix | test("^[0-9]+$"))
                  | ($base + "-" + $suffix)
                ')"
                if [ -n "$DUP_NAMES" ]; then
                  echo "Cleaning duplicate project imports for ${REPO_NAME}"
                  for DUP in $DUP_NAMES; do
                    echo "Deleting duplicate project: ${DUP}"
                    DEL_RESPONSE="$(mktemp)"
                    DEL_CODE="$(curl -sS -o "$DEL_RESPONSE" -w '%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -X DELETE "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/projects/${DUP}" || true)"
                    if [ "$DEL_CODE" = "404" ] || [ "$DEL_CODE" = "405" ]; then
                      DEL_CODE="$(curl -sS -o "$DEL_RESPONSE" -w '%{http_code}' \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -X DELETE "${WORKBENCH_BASE}/rest/projects/${SPACE_NAME}/${DUP}" || true)"
                    fi
                    if [ "$DEL_CODE" = "200" ] || [ "$DEL_CODE" = "202" ] || [ "$DEL_CODE" = "204" ]; then
                      echo "OK: Deleted duplicate project: ${DUP}"
                    else
                      echo "WARN: Failed to delete duplicate project ${DUP} (HTTP ${DEL_CODE})"
                      cat "$DEL_RESPONSE"
                      echo
                    fi
                    rm -f "$DEL_RESPONSE"
                  done
                fi
              else
                echo "WARN: Unable to list projects (HTTP ${PROJECT_CODE}); continuing"
              fi

              SKIP_CLONE="false"
              if [ "$PROJECT_EXISTS" = "false" ] && [ "$NIOGIT_CANONICAL" = "true" ]; then
                echo "Repo exists on disk; waiting for Workbench to register project..."
                if wait_for_project 6; then
                  echo "OK: Project registered: ${REPO_NAME}"
                else
                  echo "WARN: Project not registered yet; skipping clone to avoid duplicates."
                  SKIP_CLONE="true"
                fi
              fi

              CLONE_PAYLOAD="$(jq -n \
                --arg name "$REPO_NAME" \
                --arg url "$REPO_URL" \
                --arg user "$GH_USER" \
                --arg pass "$GH_TOKEN" \
                '{name:$name, gitURL:$url, userName:$user, password:$pass}')"

              NEED_PULL="false"
              if [ "$PROJECT_EXISTS" = "true" ]; then
                echo "Project already exists; pulling latest: ${REPO_NAME}"
                NEED_PULL="true"
              else
                if [ "$SKIP_CLONE" = "true" ]; then
                  echo "Skipping clone because repo exists on disk and project is not registered."
                  NEED_PULL="false"
                else
                  CLONE_RESPONSE="$(mktemp)"
                  CLONE_CODE="$(curl -sS -o "$CLONE_RESPONSE" -w '%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -X POST "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/git/clone" \
                    -d "$CLONE_PAYLOAD" || true)"
                  if [ "$CLONE_CODE" = "202" ] || [ "$CLONE_CODE" = "201" ] || [ "$CLONE_CODE" = "200" ]; then
                    echo "OK: Repo import requested: ${REPO_NAME}"
                  elif [ "$CLONE_CODE" = "409" ]; then
                    echo "Repo already exists; pulling latest: ${REPO_NAME}"
                    NEED_PULL="true"
                    PROJECT_EXISTS="true"
                  else
                    echo "Repo import failed (HTTP ${CLONE_CODE}); response body:"
                    cat "$CLONE_RESPONSE"
                    echo
                    echo "Checking for existing project to pull latest..."
                    NEED_PULL="true"
                    if [ "$PROJECT_CODE" = "200" ] && [ "$PROJECT_EXISTS" = "true" ]; then
                      :
                    elif [ "$PROJECT_CODE" != "200" ]; then
                      refresh_project_list
                    fi
                  fi
                  rm -f "$CLONE_RESPONSE"
                fi
              fi

              if [ "$NEED_PULL" = "true" ]; then
                if [ "$PROJECT_EXISTS" = "true" ]; then
                  echo "Project exists; attempting git pull: ${REPO_NAME}"
                  PULL_RESPONSE="$(mktemp)"
                  PULL_CODE="$(curl -sS -o "$PULL_RESPONSE" -w '%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -X POST "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/projects/${REPO_NAME}/git/pull" || true)"
                  if [ "$PULL_CODE" = "404" ] || [ "$PULL_CODE" = "405" ]; then
                    PULL_CODE="$(curl -sS -o "$PULL_RESPONSE" -w '%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -H "Content-Type: application/json" \
                      -X POST "${WORKBENCH_BASE}/rest/projects/${SPACE_NAME}/${REPO_NAME}/git/pull" || true)"
                  fi
                  if [ "$PULL_CODE" = "200" ] || [ "$PULL_CODE" = "202" ] || [ "$PULL_CODE" = "204" ]; then
                    echo "OK: Repo pull requested: ${REPO_NAME}"
                  else
                    if [ "$PULL_CODE" = "404" ]; then
                      echo "WARN: Repo pull returned 404; waiting for project registration..."
                      if wait_for_project 6; then
                        echo "Retrying repo pull after registration..."
                        PULL_CODE="$(curl -sS -o "$PULL_RESPONSE" -w '%{http_code}' \
                          -H "Authorization: Bearer ${TOKEN}" \
                          -H "Accept: application/json" \
                          -H "Content-Type: application/json" \
                          -X POST "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/projects/${REPO_NAME}/git/pull" || true)"
                        if [ "$PULL_CODE" = "404" ] || [ "$PULL_CODE" = "405" ]; then
                          PULL_CODE="$(curl -sS -o "$PULL_RESPONSE" -w '%{http_code}' \
                            -H "Authorization: Bearer ${TOKEN}" \
                            -H "Accept: application/json" \
                            -H "Content-Type: application/json" \
                            -X POST "${WORKBENCH_BASE}/rest/projects/${SPACE_NAME}/${REPO_NAME}/git/pull" || true)"
                        fi
                        if [ "$PULL_CODE" = "200" ] || [ "$PULL_CODE" = "202" ] || [ "$PULL_CODE" = "204" ]; then
                          echo "OK: Repo pull requested after registration: ${REPO_NAME}"
                        else
                          echo "WARN: Repo pull still failing (HTTP ${PULL_CODE}); skipping clone to avoid duplicates."
                        fi
                      else
                        echo "WARN: Project not registered; skipping clone to avoid duplicates."
                      fi
                    else
                      echo "ERROR: Repo pull failed (HTTP ${PULL_CODE})"
                      cat "$PULL_RESPONSE"
                      exit 1
                    fi
                  fi
                  rm -f "$PULL_RESPONSE"
                else
                  echo "ERROR: Failed to import repo and project not found in space"
                  exit 1
                fi
              fi

              remaining=""
              for i in 1 2 3 4 5; do
                cleanup_duplicate_repos
                remaining="$(find "${NIOGIT_ROOT}/${SPACE_NAME}" -maxdepth 1 -type d -name "${REPO_NAME}-*.git" 2>/dev/null | sed -n "s|.*/||p")"
                if [ -z "$remaining" ]; then
                  break
                fi
                echo "Duplicates still present; waiting for import to settle..."
                sleep 2
              done
              if [ -n "$remaining" ]; then
                echo "WARN: Duplicate repo dirs still present after cleanup:"
                echo "$remaining"
              fi

              if [ "${HOLD_POD:-false}" = "true" ]; then
                echo "Holding pod open for debugging..."
                tail -f /dev/null
              fi
          volumeMounts:
            - { name: workbench-niogit, mountPath: /niogit }
      volumes:
        - name: workbench-niogit
          persistentVolumeClaim:
            claimName: kie-workbench-niogit
