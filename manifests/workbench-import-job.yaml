apiVersion: batch/v1
kind: Job
metadata:
  name: workbench-import-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "25"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: drools-rules-service
      restartPolicy: OnFailure
      containers:
        - name: import
          image: hashicorp/vault:1.15.4
          envFrom:
            - configMapRef:
                name: workbench-import-config-tool-use-policy
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))"
              export VAULT_TOKEN

              WORKBENCH_BASE="${WORKBENCH_BASE:-}"
              SPACE_NAME="${SPACE_NAME:-}"
              SPACE_DESC="${SPACE_DESC:-}"
              DEFAULT_GROUP_ID="${DEFAULT_GROUP_ID:-}"
              REPO_NAME="${REPO_NAME:-}"
              REPO_URL="${REPO_URL:-}"
              SPACE_WAIT_SECONDS="${SPACE_WAIT_SECONDS:-300}"
              if [ -z "$WORKBENCH_BASE" ] || [ -z "$SPACE_NAME" ] || [ -z "$SPACE_DESC" ] || [ -z "$DEFAULT_GROUP_ID" ] || [ -z "$REPO_NAME" ] || [ -z "$REPO_URL" ]; then
                echo "ERROR: Missing import config (WORKBENCH_BASE, SPACE_NAME, SPACE_DESC, DEFAULT_GROUP_ID, REPO_NAME, REPO_URL)"
                exit 1
              fi

              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              CONTROLLER_JSON="$(vault kv get -format=json secret/drools/admin)"
              CONTROLLER_USER="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.username // empty')"
              CONTROLLER_PASS="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi
              if [ -z "$CONTROLLER_USER" ] || [ -z "$CONTROLLER_PASS" ]; then
                echo "ERROR: Missing controller credentials in Vault"
                exit 1
              fi

              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN" ]; then
                echo "ERROR: Missing GitHub credentials in Vault"
                exit 1
              fi

              TOKEN_URL="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token"
              TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=${KC_CLIENT_ID}" \
                --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                --data-urlencode "username=${CONTROLLER_USER}" \
                --data-urlencode "password=${CONTROLLER_PASS}" \
                "$TOKEN_URL" || true)"
              TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
              TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
              if [ "$TOKEN_CODE" = "200" ]; then
                TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
              else
                TOKEN=""
              fi
              if [ -z "$TOKEN" ]; then
                TOKEN_ERROR="$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty')"
                TOKEN_ERROR_DESC="$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty')"
                echo "ERROR: Keycloak token request failed: HTTP ${TOKEN_CODE} ${TOKEN_ERROR}${TOKEN_ERROR_DESC:+ - }${TOKEN_ERROR_DESC}"
                exit 1
              fi

              echo "Waiting for Workbench REST API..."
              CODE=""
              for i in $(seq 1 60); do
                CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_BASE}/rest/spaces" || true)"
                if [ "$CODE" = "200" ]; then
                  break
                fi
                echo "  ...not ready (HTTP ${CODE}); retrying"
                sleep 5
              done
              if [ "$CODE" != "200" ]; then
                echo "ERROR: Workbench REST API not ready (last HTTP ${CODE})"
                exit 1
              fi

              SPACE_PAYLOAD="$(jq -n \
                --arg name "$SPACE_NAME" \
                --arg desc "$SPACE_DESC" \
                --arg gid "$DEFAULT_GROUP_ID" \
                '{name:$name, description:$desc, defaultGroupId:$gid}')"
              SPACE_RESPONSE="$(mktemp)"
              SPACE_HEADERS="$(mktemp)"
              SPACE_CODE="$(curl -sS -D "$SPACE_HEADERS" -o "$SPACE_RESPONSE" -w '%{http_code}' \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -X POST "${WORKBENCH_BASE}/rest/spaces" \
                -d "$SPACE_PAYLOAD" || true)"
              if [ "$SPACE_CODE" = "201" ] || [ "$SPACE_CODE" = "200" ] || [ "$SPACE_CODE" = "409" ]; then
                echo "OK: Space ready: ${SPACE_NAME}"
              elif [ "$SPACE_CODE" = "202" ]; then
                echo "Space creation accepted; waiting for ${SPACE_NAME} to be ready..."
                READY_CODE=""
                FOUND="false"
                STEPS=$((SPACE_WAIT_SECONDS / 5))
                if [ "$STEPS" -lt 12 ]; then
                  STEPS=12
                fi
                for i in $(seq 1 "$STEPS"); do
                  LIST_BODY="$(curl -sS -w '\n%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    "${WORKBENCH_BASE}/rest/spaces" || true)"
                  LIST_JSON="$(printf '%s' "$LIST_BODY" | sed '$d')"
                  READY_CODE="$(printf '%s' "$LIST_BODY" | tail -n 1)"
                  if [ "$READY_CODE" = "200" ]; then
                    if printf '%s' "$LIST_JSON" | jq -e --arg name "$SPACE_NAME" '
                      if type == "array" then
                        .[] | select(.name == $name)
                      elif type == "object" then
                        (.spaces // .items // .result // [])[] | select(.name == $name)
                      else empty end' >/dev/null 2>&1; then
                      FOUND="true"
                      break
                    fi
                  fi
                  sleep 3
                done
                if [ "$FOUND" = "true" ]; then
                  echo "OK: Space ready: ${SPACE_NAME}"
                else
                  echo "Space list response (first 400 chars):"
                  printf '%s' "$LIST_JSON" | head -c 400 || true
                  echo
                  echo "ERROR: Space not ready after async create (last HTTP ${READY_CODE})"
                  exit 1
                fi
              else
                echo "ERROR: Failed to create space (HTTP ${SPACE_CODE})"
                echo "Response body:"
                cat "$SPACE_RESPONSE"
                exit 1
              fi
              rm -f "$SPACE_RESPONSE" "$SPACE_HEADERS"

              CLONE_PAYLOAD="$(jq -n \
                --arg name "$REPO_NAME" \
                --arg url "$REPO_URL" \
                --arg user "$GH_USER" \
                --arg pass "$GH_TOKEN" \
                '{name:$name, gitURL:$url, userName:$user, username:$user, password:$pass}')"
              CLONE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -X POST "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/git/clone" \
                -d "$CLONE_PAYLOAD" || true)"
              if [ "$CLONE_CODE" = "202" ] || [ "$CLONE_CODE" = "201" ] || [ "$CLONE_CODE" = "200" ] || [ "$CLONE_CODE" = "409" ]; then
                echo "OK: Repo import requested: ${REPO_NAME}"
              else
                echo "ERROR: Failed to import repo (HTTP ${CLONE_CODE})"
                exit 1
              fi
