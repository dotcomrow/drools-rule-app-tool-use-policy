apiVersion: batch/v1
kind: Job
metadata:
  name: workbench-import-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "25"
    rules.dotcomrow/repo-version: "1.0.171"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: drools-rules-service
      restartPolicy: OnFailure
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kie-workbench
              topologyKey: kubernetes.io/hostname
      containers:
        - name: import
          image: hashicorp/vault:1.15.4
          envFrom:
            - configMapRef:
                name: workbench-import-config-tool-use-policy
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              umask 0002
              hold_on_error() {
                code=$?
                fix_niogit_permissions || true
                if [ "$code" -ne 0 ] && [ "${HOLD_POD:-false}" = "true" ]; then
                  echo "Job failed with exit code ${code}; holding pod for debugging..."
                  while true; do sleep 3600; done
                fi
                exit "$code"
              }
              debug_enabled() {
                [ "${DEBUG_REST:-false}" = "true" ]
              }
              debug_rest() {
                label="$1"
                code="$2"
                body="$3"
                if debug_enabled; then
                  echo "DEBUG: ${label} HTTP ${code}"
                  if [ -n "$body" ]; then
                    printf '%s' "$body" | head -c 1000
                    echo
                  fi
                fi
              }
              detect_niogit_root() {
                if [ -n "${NIOGIT_ROOT:-}" ]; then
                  printf '%s' "$NIOGIT_ROOT"
                  return 0
                fi
                if find /niogit -maxdepth 2 -type d -name "*.git" ! -path "/niogit/.niogit/*" -print -quit 2>/dev/null | grep -q .; then
                  printf '%s' "/niogit"
                  return 0
                fi
                if [ -d "/niogit/.niogit" ] && find /niogit/.niogit -maxdepth 2 -type d -name "*.git" -print -quit 2>/dev/null | grep -q .; then
                  printf '%s' "/niogit/.niogit"
                  return 0
                fi
                printf '%s' "/niogit"
                return 0
              }
              fix_niogit_permissions() {
                if [ "$(id -u)" != "0" ]; then
                  return 0
                fi
                if [ -n "${SYNC_REPO:-}" ] && [ -d "$SYNC_REPO" ]; then
                  chown -R 1000:1000 "$SYNC_REPO" || true
                  chmod -R g+rwX "$SYNC_REPO" || true
                fi
                if [ -n "${NIOGIT_ROOT:-}" ] && [ -n "${SPACE_NAME:-}" ] && [ -d "${NIOGIT_ROOT}/${SPACE_NAME}" ]; then
                  chown -R 1000:1000 "${NIOGIT_ROOT}/${SPACE_NAME}" || true
                  chmod -R g+rwX "${NIOGIT_ROOT}/${SPACE_NAME}" || true
                fi
              }
              trap hold_on_error EXIT

              cleanup_duplicate_repos() {
                keep_slug="${1:-}"
                if [ -z "${NIOGIT_ROOT:-}" ] || [ -z "${SPACE_NAME:-}" ] || [ -z "${REPO_NAME:-}" ]; then
                  return 0
                fi
                if [ ! -d "${NIOGIT_ROOT}/${SPACE_NAME}" ]; then
                  echo "WARN: NIOGIT space directory not found: ${NIOGIT_ROOT}/${SPACE_NAME}"
                  return 0
                fi
                canonical="${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}.git"
                if [ -z "$keep_slug" ] && [ ! -d "$canonical" ]; then
                  echo "Skipping duplicate cleanup; canonical repo missing."
                  return 0
                fi
                for dup in $(find "${NIOGIT_ROOT}/${SPACE_NAME}" -maxdepth 1 -type d -name "${REPO_NAME}-*.git" 2>/dev/null || true); do
                  [ -d "$dup" ] || continue
                  base="$(basename "$dup")"
                  if [ -n "$keep_slug" ] && [ "$base" = "${keep_slug}.git" ]; then
                    continue
                  fi
                  suffix="${base#${REPO_NAME}-}"
                  suffix="${suffix%.git}"
                  if printf '%s' "$suffix" | grep -Eq '^[0-9]+$'; then
                    if rm -rf "$dup"; then
                      echo "Removed duplicate repo dir: ${dup}"
                    else
                      echo "WARN: Failed to remove duplicate repo dir: ${dup}"
                    fi
                  fi
                done
              }
              refresh_project_list() {
                PROJECT_EXISTS="false"
                PROJECT_ID="$REPO_NAME"
                PROJECT_SLUGS=""
                PROJECT_MAX_NUM="-1"
                PROJECT_SLUG_KEEP=""
                PROJECT_BODY="$(curl -sS -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/projects" || true)"
                PROJECT_JSON="$(printf '%s' "$PROJECT_BODY" | sed '$d')"
                PROJECT_CODE="$(printf '%s' "$PROJECT_BODY" | tail -n 1)"
                if [ "$PROJECT_CODE" != "200" ]; then
                  debug_rest "projects list" "$PROJECT_CODE" "$PROJECT_JSON"
                fi
                if [ "$PROJECT_CODE" = "200" ]; then
                  PROJECT_SLUGS="$(printf '%s' "$PROJECT_JSON" | jq -r --arg repo "$REPO_NAME" --arg space "$SPACE_NAME" '
                    def items:
                      if type == "array" then .
                      elif type == "object" then (.projects // .items // .result // [])
                      else [] end;
                    [items[] | (.publicURIs // [])[]?.uri?
                      | select(contains("/git/" + $space + "/"))
                      | split("/git/" + $space + "/") | .[1]?
                      | select(startswith($repo))
                    ]
                    | unique
                    | .[]
                  ' 2>/dev/null || true)"
                  if [ -n "$PROJECT_SLUGS" ]; then
                    for slug in $PROJECT_SLUGS; do
                      [ -n "$slug" ] || continue
                      case "$slug" in
                        "$REPO_NAME"-*)
                          num="${slug#$REPO_NAME-}"
                          if printf '%s' "$num" | grep -Eq '^[0-9]+$'; then
                            if [ "$num" -gt "$PROJECT_MAX_NUM" ]; then
                              PROJECT_MAX_NUM="$num"
                              PROJECT_SLUG_KEEP="$slug"
                            fi
                          fi
                          ;;
                        "$REPO_NAME")
                          if [ "$PROJECT_MAX_NUM" -lt 0 ]; then
                            PROJECT_SLUG_KEEP="$slug"
                          fi
                          ;;
                      esac
                    done
                    PROJECT_ID="${PROJECT_SLUG_KEEP:-$REPO_NAME}"
                    PROJECT_EXISTS="true"
                  fi
                  if debug_enabled; then
                    PROJECT_URIS="$(printf '%s' "$PROJECT_JSON" | jq -r '
                      def items:
                        if type == "array" then .
                        elif type == "object" then (.projects // .items // .result // [])
                        else [] end;
                      [items[] | (.publicURIs // [])[]?.uri?] | unique | .[]
                    ' 2>/dev/null || true)"
                    if [ -n "$PROJECT_URIS" ]; then
                      echo "DEBUG: project uris=${PROJECT_URIS}"
                    fi
                    echo "DEBUG: project slugs=${PROJECT_SLUGS:-<none>}"
                    echo "DEBUG: project slug keep=${PROJECT_SLUG_KEEP:-<none>}"
                    echo "DEBUG: project id=${PROJECT_ID}"
                  fi
                fi
              }
              wait_for_project() {
                attempts="${1:-30}"
                for i in $(seq 1 "$attempts"); do
                  refresh_project_list
                  if [ "$PROJECT_EXISTS" = "true" ]; then
                    echo "Project visible in Workbench (attempt ${i}/${attempts})"
                    return 0
                  fi
                  if debug_enabled; then
                    if [ "$i" = "1" ] || [ "$i" = "$attempts" ] || [ "$PROJECT_CODE" != "200" ]; then
                      debug_rest "projects list (attempt ${i}/${attempts})" "$PROJECT_CODE" "$PROJECT_JSON"
                    fi
                  fi
                  echo "Project not visible yet (attempt ${i}/${attempts}, HTTP ${PROJECT_CODE})"
                  sleep 2
                done
                return 1
              }
              apk add --no-cache curl jq git python3
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))"
              export VAULT_TOKEN

              WORKBENCH_BASE="${WORKBENCH_BASE:-}"
              SPACE_NAME="${SPACE_NAME:-}"
              SPACE_DESC="${SPACE_DESC:-}"
              DEFAULT_GROUP_ID="${DEFAULT_GROUP_ID:-}"
              REPO_NAME="${REPO_NAME:-}"
              REPO_URL="${REPO_URL:-}"
              REPO_BRANCH="${REPO_BRANCH:-}"
              REPO_VERSION="${REPO_VERSION:-}"
              VERSION_PREFIX="${VERSION_PREFIX:-}"
              SPACE_WAIT_SECONDS="${SPACE_WAIT_SECONDS:-300}"
              SPACE_OWNER="${SPACE_OWNER:-}"
              if [ -z "$WORKBENCH_BASE" ] || [ -z "$SPACE_NAME" ] || [ -z "$SPACE_DESC" ] || [ -z "$DEFAULT_GROUP_ID" ] || [ -z "$REPO_NAME" ] || [ -z "$REPO_URL" ]; then
                echo "ERROR: Missing import config (WORKBENCH_BASE, SPACE_NAME, SPACE_DESC, DEFAULT_GROUP_ID, REPO_NAME, REPO_URL)"
                exit 1
              fi

              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              CONTROLLER_JSON="$(vault kv get -format=json secret/drools/admin)"
              CONTROLLER_USER="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.username // empty')"
              CONTROLLER_PASS="$(printf '%s' "$CONTROLLER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi
              if [ -z "$SPACE_OWNER" ]; then
                if [ -n "$CONTROLLER_USER" ]; then
                  SPACE_OWNER="$CONTROLLER_USER"
                else
                  SPACE_OWNER="service-account-${KC_CLIENT_ID}"
                fi
              fi

              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN" ]; then
                echo "ERROR: Missing GitHub credentials in Vault"
                exit 1
              fi

              TOKEN_URL="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token"
              TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=client_credentials" \
                --data-urlencode "client_id=${KC_CLIENT_ID}" \
                --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                "$TOKEN_URL" || true)"
              TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
              TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
              if [ "$TOKEN_CODE" = "200" ]; then
                TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
              else
                TOKEN=""
              fi
              if [ -z "$TOKEN" ]; then
                TOKEN_ERROR="$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty')"
                TOKEN_ERROR_DESC="$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty')"
                if debug_enabled; then
                  debug_rest "token request" "$TOKEN_CODE" "$TOKEN_BODY"
                fi
                echo "ERROR: Keycloak token request failed: HTTP ${TOKEN_CODE} ${TOKEN_ERROR}${TOKEN_ERROR_DESC:+ - }${TOKEN_ERROR_DESC}"
                exit 1
              fi

              echo "Waiting for Workbench REST API..."
              CODE=""
              SPACES_JSON=""
              for i in $(seq 1 60); do
                SPACES_BODY="$(curl -sS -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_BASE}/rest/spaces" || true)"
                SPACES_JSON="$(printf '%s' "$SPACES_BODY" | sed '$d')"
                CODE="$(printf '%s' "$SPACES_BODY" | tail -n 1)"
                if [ "$CODE" = "200" ]; then
                  break
                fi
                debug_rest "spaces list" "$CODE" "$SPACES_JSON"
                echo "  ...not ready (HTTP ${CODE}); retrying"
                sleep 5
              done
              if [ "$CODE" != "200" ]; then
                debug_rest "spaces list" "$CODE" "$SPACES_JSON"
                echo "ERROR: Workbench REST API not ready (last HTTP ${CODE})"
                exit 1
              fi

              SPACE_PAYLOAD="$(jq -n \
                --arg name "$SPACE_NAME" \
                --arg desc "$SPACE_DESC" \
                --arg gid "$DEFAULT_GROUP_ID" \
                --arg owner "$SPACE_OWNER" \
                '{name:$name, description:$desc, defaultGroupId:$gid, owner:$owner}')"
              SPACE_EXISTS="false"
              if printf '%s' "$SPACES_JSON" | jq -e --arg name "$SPACE_NAME" '
                if type == "array" then
                  .[] | select(.name == $name)
                elif type == "object" then
                  (.spaces // .items // .result // [])[] | select(.name == $name)
                else empty end' >/dev/null 2>&1; then
                SPACE_EXISTS="true"
              fi

              SPACE_RESPONSE="$(mktemp)"
              SPACE_HEADERS="$(mktemp)"
              SPACE_CODE=""
              if [ "$SPACE_EXISTS" = "true" ]; then
                echo "OK: Space already exists: ${SPACE_NAME}"
                SPACE_CODE="409"
              else
                SPACE_CODE="$(curl -sS -D "$SPACE_HEADERS" -o "$SPACE_RESPONSE" -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -X POST "${WORKBENCH_BASE}/rest/spaces" \
                  -d "$SPACE_PAYLOAD" || true)"
              fi
              if [ "$SPACE_CODE" = "201" ] || [ "$SPACE_CODE" = "200" ] || [ "$SPACE_CODE" = "409" ]; then
                echo "OK: Space ready: ${SPACE_NAME}"
              elif [ "$SPACE_CODE" = "202" ]; then
                echo "Space creation accepted; waiting for ${SPACE_NAME} to be ready..."
                echo "Space create response headers:"
                cat "$SPACE_HEADERS"
                echo "Space create response body:"
                cat "$SPACE_RESPONSE"
                echo
                READY_CODE=""
                FOUND="false"
                STEPS=$((SPACE_WAIT_SECONDS / 5))
                if [ "$STEPS" -lt 12 ]; then
                  STEPS=12
                fi
                JOB_URL="$(awk -F': ' 'tolower($1)=="location"{print $2}' "$SPACE_HEADERS" | tr -d '\r')"
                if [ -z "$JOB_URL" ]; then
                  JOB_URL="$(jq -r '.location // .url // .href // empty' "$SPACE_RESPONSE" 2>/dev/null || true)"
                fi
                JOB_ID="$(jq -r '.jobId // .id // .job_id // .jobID // empty' "$SPACE_RESPONSE" 2>/dev/null || true)"
                if [ -n "$JOB_URL" ]; then
                  case "$JOB_URL" in
                    http*) ;;
                    /*) JOB_URL="${WORKBENCH_BASE%/}${JOB_URL}" ;;
                    *) JOB_URL="${WORKBENCH_BASE%/}/$JOB_URL" ;;
                  esac
                elif [ -n "$JOB_ID" ]; then
                  JOB_URL="${WORKBENCH_BASE%/}/rest/jobs/${JOB_ID}"
                fi
                if [ -n "$JOB_URL" ]; then
                  echo "Polling space job: ${JOB_URL}"
                  for i in $(seq 1 "$STEPS"); do
                    JOB_BODY="$(curl -sS -w '\n%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      "$JOB_URL" || true)"
                    JOB_JSON="$(printf '%s' "$JOB_BODY" | sed '$d')"
                    JOB_CODE="$(printf '%s' "$JOB_BODY" | tail -n 1)"
                    if [ "$JOB_CODE" = "200" ]; then
                      JOB_STATUS_RAW="$(printf '%s' "$JOB_JSON" | jq -r '.status // .state // .jobStatus // .result // empty' 2>/dev/null || true)"
                      if [ -n "$JOB_STATUS_RAW" ]; then
                        JOB_STATUS="$(printf '%s' "$JOB_STATUS_RAW" | tr '[:upper:]' '[:lower:]')"
                        echo "Job status: ${JOB_STATUS_RAW}"
                        case "$JOB_STATUS" in
                          *success*|*succeeded*|*done*|*finished*|*completed*)
                            break
                            ;;
                          *fail*|*error*|*bad_request*|*rejected*|*denied*)
                            if printf '%s' "$JOB_JSON" | jq -r '.result // empty' | rg -qi "already exists"; then
                              echo "OK: Space already exists: ${SPACE_NAME}"
                              break
                            fi
                            echo "ERROR: Space job failed"
                            echo "$JOB_JSON"
                            exit 1
                            ;;
                        esac
                      else
                        echo "Job response (first 400 chars):"
                        printf '%s' "$JOB_JSON" | head -c 400 || true
                        echo
                      fi
                    else
                      echo "Job poll returned HTTP ${JOB_CODE}"
                      printf '%s' "$JOB_JSON" | head -c 400 || true
                      echo
                    fi
                    sleep 3
                  done
                fi
                for i in $(seq 1 "$STEPS"); do
                  LIST_BODY="$(curl -sS -w '\n%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    "${WORKBENCH_BASE}/rest/spaces" || true)"
                  LIST_JSON="$(printf '%s' "$LIST_BODY" | sed '$d')"
                  READY_CODE="$(printf '%s' "$LIST_BODY" | tail -n 1)"
                  if [ "$READY_CODE" = "200" ]; then
                    if printf '%s' "$LIST_JSON" | jq -e --arg name "$SPACE_NAME" '
                      if type == "array" then
                        .[] | select(.name == $name)
                      elif type == "object" then
                        (.spaces // .items // .result // [])[] | select(.name == $name)
                      else empty end' >/dev/null 2>&1; then
                      FOUND="true"
                      break
                    fi
                  fi
                  sleep 3
                done
                if [ "$FOUND" = "true" ]; then
                  echo "OK: Space ready: ${SPACE_NAME}"
                else
                  echo "Space list response (first 400 chars):"
                  printf '%s' "$LIST_JSON" | head -c 400 || true
                  echo
                  echo "ERROR: Space not ready after async create (last HTTP ${READY_CODE})"
                  exit 1
                fi
              else
                echo "ERROR: Failed to create space (HTTP ${SPACE_CODE})"
                echo "Response body:"
                cat "$SPACE_RESPONSE"
                exit 1
              fi
              rm -f "$SPACE_RESPONSE" "$SPACE_HEADERS"

              NIOGIT_ROOT="$(detect_niogit_root)"
              NIOGIT_CANONICAL="false"
              SYNC_REPO=""
              update_repo_head() {
                if [ -z "${NIOGIT_ROOT:-}" ] || [ -z "${SPACE_NAME:-}" ] || [ -z "${REPO_NAME:-}" ]; then
                  return 0
                fi
                for repo in "${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}"*.git; do
                  [ -d "$repo" ] || continue
                  target=""
                  for branch in "${REPO_BRANCH:-}" prod main master; do
                    [ -n "$branch" ] || continue
                    if git --git-dir="$repo" show-ref --quiet "refs/remotes/origin/$branch"; then
                      target="$branch"
                      break
                    fi
                    if git --git-dir="$repo" show-ref --quiet "refs/heads/$branch"; then
                      target="$branch"
                      break
                    fi
                  done
                  if [ -n "$target" ]; then
                    if git --git-dir="$repo" show-ref --quiet "refs/remotes/origin/$target"; then
                      git --git-dir="$repo" update-ref "refs/heads/$target" "refs/remotes/origin/$target"
                    fi
                    git --git-dir="$repo" symbolic-ref HEAD "refs/heads/$target" || true
                    echo "Set $(basename "$repo") HEAD -> $target"
                  else
                    echo "WARN: No target branch found for $(basename "$repo")"
                  fi
                done
              }
              git_auth_header() {
                printf '%s' "$GH_USER:$GH_TOKEN" | base64 | tr -d '\n'
              }
              git_sync_repo() {
                repo="$1"
                if [ ! -d "$repo" ]; then
                  echo "ERROR: Repo dir not found: $repo"
                  return 1
                fi
                if ! git --git-dir="$repo" remote get-url origin >/dev/null 2>&1; then
                  git --git-dir="$repo" remote add origin "$REPO_URL"
                else
                  git --git-dir="$repo" remote set-url origin "$REPO_URL"
                fi
                auth_header="$(git_auth_header)"
                GIT_TERMINAL_PROMPT=0 git -c http.extraHeader="Authorization: Basic ${auth_header}" \
                  --git-dir="$repo" fetch --prune origin
              }
              ensure_pom_version() {
                desired="${REPO_VERSION:-}"
                case "$desired" in
                  ""|"auto"|"latest"|"undefined"|"null")
                    desired=""
                    ;;
                esac
                if [ -z "${SYNC_REPO:-}" ] || [ ! -d "$SYNC_REPO" ]; then
                  echo "WARN: SYNC_REPO not available; skipping pom version update."
                  return 0
                fi
                head_ref="$(git --git-dir="$SYNC_REPO" symbolic-ref -q HEAD || true)"
                if [ -z "$head_ref" ]; then
                  echo "WARN: Repo HEAD is detached; skipping pom version update."
                  return 0
                fi
                branch="${head_ref#refs/heads/}"
                tmpdir="$(mktemp -d)"
                if ! git --git-dir="$SYNC_REPO" --work-tree="$tmpdir" checkout -f "$branch"; then
                  echo "WARN: Failed to checkout $branch for pom update."
                  rm -rf "$tmpdir"
                  return 0
                fi
                pom_path="$tmpdir/pom.xml"
                if [ ! -f "$pom_path" ]; then
                  echo "WARN: pom.xml not found; skipping pom version update."
                  rm -rf "$tmpdir"
                  return 0
                fi
                if [ -z "$desired" ]; then
                  desired="$(POM_PATH="$pom_path" GIT_DIR="$SYNC_REPO" VERSION_PREFIX="${VERSION_PREFIX:-}" python3 - <<'PY'
              import os
              import re
              import subprocess
              import sys
              import xml.etree.ElementTree as ET

              path = os.environ.get("POM_PATH", "")
              git_dir = os.environ.get("GIT_DIR", "")
              prefix = os.environ.get("VERSION_PREFIX", "").strip()
              if not path:
                  sys.exit(0)

              def find_text(elem, tag, ns):
                  if ns:
                      found = elem.find(f"{{{ns}}}{tag}")
                  else:
                      found = elem.find(tag)
                  if found is not None and found.text:
                      return found.text.strip()
                  return ""

              def read_pom(pom_path):
                  tree = ET.parse(pom_path)
                  root = tree.getroot()
                  ns = ""
                  if root.tag.startswith("{"):
                      ns = root.tag.split("}")[0].strip("{")
                  version = find_text(root, "version", ns)
                  if not version:
                      parent = root.find(f"{{{ns}}}parent") if ns else root.find("parent")
                      if parent is not None:
                          version = find_text(parent, "version", ns)
                  revision = ""
                  props = root.find(f"{{{ns}}}properties") if ns else root.find("properties")
                  if props is not None:
                      rev_el = props.find(f"{{{ns}}}revision") if ns else props.find("revision")
                      if rev_el is not None and rev_el.text:
                          revision = rev_el.text.strip()
                  return version, revision

              def is_literal(val):
                  return bool(val) and "${" not in val

              version, revision = read_pom(path)
              if is_literal(version):
                  print(version)
                  sys.exit(0)
              if is_literal(revision) and not revision.endswith("-SNAPSHOT"):
                  print(revision)
                  sys.exit(0)

              candidate = revision or version or ""
              if not prefix:
                  match = re.match(r"(\d+)\.(\d+)", candidate)
                  if match:
                      prefix = f"{match.group(1)}.{match.group(2)}."
              if not prefix:
                  sys.exit(0)
              if not prefix.endswith("."):
                  prefix = prefix + "."

              if not git_dir:
                  sys.exit(0)
              try:
                  count = subprocess.check_output(
                      ["git", "--git-dir", git_dir, "rev-list", "--count", "HEAD"],
                      text=True,
                  ).strip()
              except Exception:
                  count = ""
              if not count:
                  sys.exit(0)
              print(prefix + count)
              PY
                )"
                fi
                if [ -z "$desired" ]; then
                  echo "WARN: Unable to resolve repo version; skipping pom version update."
                  rm -rf "$tmpdir"
                  return 0
                fi
                REPO_VERSION="$desired" POM_PATH="$pom_path" python3 - <<'PY'
              import os
              import re
              import sys

              path = os.environ.get("POM_PATH", "")
              version = os.environ.get("REPO_VERSION", "").strip()
              if not path or not version:
                  sys.exit(0)

              text = open(path, encoding="utf-8").read()
              updated = False

              project_version_pattern = re.compile(
                  r"(<artifactId>[^<]+</artifactId>\s*<version>)([^<]*)(</version>)",
                  re.MULTILINE,
              )
              match = project_version_pattern.search(text)
              if match:
                  current = match.group(2).strip()
                  if current != version:
                      text = project_version_pattern.sub(r"\g<1>" + version + r"\g<3>", text, count=1)
                      updated = True
              else:
                  print("WARN: Unable to locate project version in pom.xml", file=sys.stderr)

              revision_pattern = re.compile(r"(<revision>)([^<]*)(</revision>)", re.MULTILINE)
              match = revision_pattern.search(text)
              if match:
                  current = match.group(2).strip()
                  if current != version:
                      text = revision_pattern.sub(r"\g<1>" + version + r"\g<3>", text, count=1)
                      updated = True

              if updated:
                  with open(path, "w", encoding="utf-8") as handle:
                      handle.write(text)
              PY
                if git --git-dir="$SYNC_REPO" --work-tree="$tmpdir" diff --quiet -- pom.xml; then
                  echo "POM version already set to ${desired}."
                  rm -rf "$tmpdir"
                  return 0
                fi
                git --git-dir="$SYNC_REPO" --work-tree="$tmpdir" add pom.xml
                if git --git-dir="$SYNC_REPO" --work-tree="$tmpdir" \
                  -c user.name="workbench-import" -c user.email="workbench-import@local" \
                  commit -m "chore: set project version to ${desired}" >/dev/null 2>&1; then
                  echo "Updated pom.xml project version to ${desired}."
                else
                  echo "WARN: Failed to commit pom.xml version update."
                fi
                rm -rf "$tmpdir"
              }
              if [ -d "${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}.git" ]; then
                NIOGIT_CANONICAL="true"
              fi

              refresh_project_list
              if [ "$PROJECT_CODE" = "200" ]; then
                if [ -n "$PROJECT_SLUGS" ]; then
                  echo "Detected project repos: ${PROJECT_SLUGS}"
                  if [ -n "$PROJECT_SLUG_KEEP" ]; then
                    echo "Keeping project repo: ${PROJECT_SLUG_KEEP}"
                  fi
                fi
              else
                echo "WARN: Unable to list projects (HTTP ${PROJECT_CODE}); continuing"
              fi

              if [ "$PROJECT_EXISTS" = "false" ] && [ "$NIOGIT_CANONICAL" = "true" ]; then
                echo "Repo exists on disk; waiting for Workbench to register project..."
                if wait_for_project 30; then
                  echo "OK: Project registered: ${REPO_NAME}"
                  PROJECT_EXISTS="true"
                  refresh_project_list
                else
                  echo "Project not registered yet; importing from GitHub."
                fi
              fi

              if [ "$PROJECT_EXISTS" = "false" ]; then
                CLONE_PAYLOAD="$(jq -n \
                  --arg name "$REPO_NAME" \
                  --arg url "$REPO_URL" \
                  --arg user "$GH_USER" \
                  --arg pass "$GH_TOKEN" \
                  '{name:$name, gitURL:$url, userName:$user, password:$pass}')"
                CLONE_RESPONSE="$(mktemp)"
                CLONE_HEADERS="$(mktemp)"
                CLONE_CODE="$(curl -sS -D "$CLONE_HEADERS" -o "$CLONE_RESPONSE" -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -X POST "${WORKBENCH_BASE}/rest/spaces/${SPACE_NAME}/git/clone" \
                  -d "$CLONE_PAYLOAD" || true)"
                if [ "$CLONE_CODE" = "202" ] || [ "$CLONE_CODE" = "201" ] || [ "$CLONE_CODE" = "200" ] || [ "$CLONE_CODE" = "409" ]; then
                  echo "OK: Repo import requested: ${REPO_NAME} (HTTP ${CLONE_CODE})"
                  debug_rest "repo import" "$CLONE_CODE" "$(cat "$CLONE_RESPONSE")"
                  if wait_for_project 60; then
                    PROJECT_EXISTS="true"
                    refresh_project_list
                  else
                    echo "ERROR: Project not visible after import"
                    debug_rest "repo import" "$CLONE_CODE" "$(cat "$CLONE_RESPONSE")"
                    exit 1
                  fi
                else
                  echo "ERROR: Repo import failed (HTTP ${CLONE_CODE})"
                  debug_rest "repo import" "$CLONE_CODE" "$(cat "$CLONE_RESPONSE")"
                  cat "$CLONE_RESPONSE"
                  exit 1
                fi
                rm -f "$CLONE_RESPONSE" "$CLONE_HEADERS"
              fi

              if [ "$PROJECT_EXISTS" = "true" ]; then
                if [ -n "$PROJECT_SLUG_KEEP" ]; then
                  cleanup_duplicate_repos "$PROJECT_SLUG_KEEP"
                  SYNC_REPO="${NIOGIT_ROOT}/${SPACE_NAME}/${PROJECT_SLUG_KEEP}.git"
                else
                  SYNC_REPO="${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}.git"
                fi
              elif [ "$NIOGIT_CANONICAL" = "true" ]; then
                SYNC_REPO="${NIOGIT_ROOT}/${SPACE_NAME}/${REPO_NAME}.git"
              fi

              if [ -z "$SYNC_REPO" ] || [ ! -d "$SYNC_REPO" ]; then
                echo "ERROR: Unable to determine repo dir to sync."
                if [ -d "${NIOGIT_ROOT}/${SPACE_NAME}" ]; then
                  echo "Available repos:"
                  ls -1 "${NIOGIT_ROOT}/${SPACE_NAME}" || true
                fi
                exit 1
              fi

              echo "Syncing repo on disk: ${SYNC_REPO}"
              git_sync_repo "$SYNC_REPO"
              update_repo_head
              ensure_pom_version
              fix_niogit_permissions

              remaining=""
              for i in $(seq 1 20); do
                cleanup_duplicate_repos "$PROJECT_SLUG_KEEP"
                remaining="$(find "${NIOGIT_ROOT}/${SPACE_NAME}" -maxdepth 1 -type d -name "${REPO_NAME}-*.git" 2>/dev/null | sed -n "s|.*/||p")"
                if [ -n "$PROJECT_SLUG_KEEP" ]; then
                  remaining="$(printf '%s\n' "$remaining" | awk -v keep="${PROJECT_SLUG_KEEP}.git" '$0 != keep')"
                fi
                if [ -z "$remaining" ]; then
                  break
                fi
                echo "Duplicates still present; waiting for import to settle..."
                sleep 3
              done
              if [ -n "$remaining" ]; then
                echo "WARN: Duplicate repo dirs still present after cleanup:"
                echo "$remaining"
              fi

              if [ "${HOLD_POD:-false}" = "true" ]; then
                echo "Holding pod open for debugging..."
                tail -f /dev/null
              fi
          volumeMounts:
            - { name: workbench-niogit, mountPath: /niogit }
      volumes:
        - name: workbench-niogit
          persistentVolumeClaim:
            claimName: kie-workbench-niogit
