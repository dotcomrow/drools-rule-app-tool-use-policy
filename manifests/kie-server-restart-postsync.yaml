apiVersion: batch/v1
kind: Job
metadata:
  name: kie-server-restart-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "30"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: drools-workbench
      restartPolicy: Never
      containers:
        - name: restart
          image: registry.k8s.io/kubectl:v1.28.9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Restarting KIE server StatefulSet to pick up Maven repo config..."
              kubectl -n drools rollout restart statefulset/kie-server
              kubectl -n drools rollout status statefulset/kie-server --timeout=15m
