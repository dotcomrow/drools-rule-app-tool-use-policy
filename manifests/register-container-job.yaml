apiVersion: batch/v1
kind: Job
metadata:
  name: register-kie-container-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: drools-rules-service
      restartPolicy: OnFailure
      containers:
        - name: register
          image: hashicorp/vault:1.15.4
          envFrom:
            - configMapRef:
                name: register-container-config-tool-use-policy
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq git python3
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              WORKBENCH_CONTROLLER_URL="${WORKBENCH_CONTROLLER_URL:-}"
              REPO_URL="${REPO_URL:-}"
              REPO_BRANCH="${REPO_BRANCH:-}"
              KIE_SERVER_ID="${KIE_SERVER_ID:-}"
              KIE_SERVER_IDS="${KIE_SERVER_IDS:-}"
              KIE_SERVER_ID_PREFIX="${KIE_SERVER_ID_PREFIX:-}"
              KIE_SERVER_MIN_COUNT="${KIE_SERVER_MIN_COUNT:-0}"
              CONTAINER_ID="${CONTAINER_ID:-}"
              GROUP_ID="${GROUP_ID:-}"
              ARTIFACT_ID="${ARTIFACT_ID:-}"
              VERSION="${VERSION:-}"
              VERSION_PREFIX="${VERSION_PREFIX:-}"
              CONTAINER_STATUS="${CONTAINER_STATUS:-STARTED}"
              if ! printf '%s' "$KIE_SERVER_MIN_COUNT" | grep -q '^[0-9][0-9]*$'; then
                echo "ERROR: KIE_SERVER_MIN_COUNT must be a non-negative integer"
                exit 1
              fi
              if [ -z "$WORKBENCH_CONTROLLER_URL" ] || [ -z "$CONTAINER_ID" ] || [ -z "$GROUP_ID" ] || [ -z "$ARTIFACT_ID" ] || ( [ -z "$KIE_SERVER_ID" ] && [ -z "$KIE_SERVER_IDS" ] ); then
                echo "ERROR: Missing registration config (WORKBENCH_CONTROLLER_URL, KIE_SERVER_ID or KIE_SERVER_IDS, CONTAINER_ID, GROUP_ID, ARTIFACT_ID)"
                exit 1
              fi

              echo "Vault login ok. Fetching Keycloak Workbench client and controller credentials"
              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              if [ -n "$KC_CLIENT_ID" ]; then
                echo "Keycloak client id: ${KC_CLIENT_ID}"
              else
                echo "Keycloak client id missing"
              fi
              if [ -n "$KC_CLIENT_SECRET" ]; then
                echo "Keycloak client secret length: ${#KC_CLIENT_SECRET}"
              else
                echo "Keycloak client secret missing"
              fi
              TOKEN=""
              TOKEN_EXPIRES_AT=""
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi
              GH_USER=""
              GH_TOKEN=""
              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username 2>/dev/null || true)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token 2>/dev/null || true)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN" ]; then
                echo "WARN: GitHub credentials not found; attempting anonymous repo access."
              fi
              TOKEN_URL="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token"
              TOKEN_REFRESH_SKEW="${TOKEN_REFRESH_SKEW:-30}"
              fetch_token() {
                TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "grant_type=client_credentials" \
                  --data-urlencode "client_id=${KC_CLIENT_ID}" \
                  --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                  "$TOKEN_URL" || true)"
                TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
                TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
                if [ "$TOKEN_CODE" = "200" ]; then
                  TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
                  EXPIRES_IN="$(printf '%s' "$TOKEN_BODY" | jq -r '.expires_in // empty')"
                  if [ -z "${EXPIRES_IN:-}" ] || ! printf '%s' "$EXPIRES_IN" | grep -q '^[0-9][0-9]*$'; then
                    EXPIRES_IN="300"
                  fi
                  now="$(date +%s)"
                  TOKEN_EXPIRES_AT=$((now + EXPIRES_IN - TOKEN_REFRESH_SKEW))
                  if [ "$TOKEN_EXPIRES_AT" -le "$now" ]; then
                    TOKEN_EXPIRES_AT=$((now + EXPIRES_IN))
                  fi
                  if [ -n "$TOKEN" ]; then
                    echo "Keycloak token acquired (expires in ${EXPIRES_IN}s)"
                  else
                    echo "Keycloak token missing in response"
                  fi
                else
                  TOKEN_ERROR="$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty')"
                  TOKEN_ERROR_DESC="$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty')"
                  echo "Keycloak token request failed: HTTP ${TOKEN_CODE} ${TOKEN_ERROR}${TOKEN_ERROR_DESC:+ - }${TOKEN_ERROR_DESC}"
                fi
                if [ -z "$TOKEN" ]; then
                  echo "ERROR: Could not obtain Keycloak token"
                  exit 1
                fi
              }
              ensure_token() {
                now="$(date +%s)"
                if [ -z "${TOKEN:-}" ] || [ -z "${TOKEN_EXPIRES_AT:-}" ] || [ "$now" -ge "$TOKEN_EXPIRES_AT" ]; then
                  fetch_token
                fi
              }
              fetch_token

              LOG_HTTP="${LOG_HTTP:-true}"
              LOG_HTTP_ONLY_ERRORS="${LOG_HTTP_ONLY_ERRORS:-true}"
              LOG_HTTP_BODY_MAX="${LOG_HTTP_BODY_MAX:-1200}"

              log_http_response() {
                local method="$1"
                local url="$2"
                local code="$3"
                local headers_file="${4:-}"
                local body_file="${5:-}"
                if [ "${LOG_HTTP:-false}" != "true" ]; then
                  return 0
                fi
                if [ "${LOG_HTTP_ONLY_ERRORS:-true}" = "true" ]; then
                  case "$code" in
                    2*|3*) return 0 ;;
                  esac
                fi
                echo "HTTP ${method} ${url} -> ${code}" >&2
                if [ -n "$headers_file" ] && [ -f "$headers_file" ]; then
                  echo "Response headers:" >&2
                  sed -e 's/^Set-Cookie:.*/Set-Cookie: REDACTED/' "$headers_file" | tr -d '\r' >&2
                fi
                if [ -n "$body_file" ] && [ -f "$body_file" ]; then
                  echo "Response body (first ${LOG_HTTP_BODY_MAX} bytes):" >&2
                  head -c "$LOG_HTTP_BODY_MAX" "$body_file" >&2
                  echo >&2
                fi
              }

              git_auth_header() {
                if [ -z "${GH_USER:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
                  return 0
                fi
                printf '%s' "$GH_USER:$GH_TOKEN" | base64 | tr -d '\n'
              }

              resolve_repo_version() {
                if [ -z "$REPO_URL" ]; then
                  echo ""
                  return 0
                fi
                tmpdir="$(mktemp -d)"
                auth_header="$(git_auth_header)"
                if [ -n "$auth_header" ]; then
                  if ! GIT_TERMINAL_PROMPT=0 git -c http.extraHeader="Authorization: Basic ${auth_header}" clone "$REPO_URL" "$tmpdir"; then
                    echo "WARN: Failed to clone repo for version resolution." >&2
                    rm -rf "$tmpdir"
                    echo ""
                    return 0
                  fi
                else
                  if ! GIT_TERMINAL_PROMPT=0 git clone "$REPO_URL" "$tmpdir"; then
                    echo "WARN: Failed to clone repo for version resolution." >&2
                    rm -rf "$tmpdir"
                    echo ""
                    return 0
                  fi
                fi
                branch=""
                for candidate in "${REPO_BRANCH:-}" prod main master; do
                  [ -n "$candidate" ] || continue
                  if git -C "$tmpdir" show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
                    branch="$candidate"
                    break
                  fi
                  if git -C "$tmpdir" show-ref --verify --quiet "refs/heads/$candidate"; then
                    branch="$candidate"
                    break
                  fi
                done
                if [ -n "$branch" ]; then
                  git -C "$tmpdir" checkout -f "$branch" >/dev/null 2>&1 || true
                fi
                pom_path="$tmpdir/pom.xml"
                if [ ! -f "$pom_path" ]; then
                  echo "WARN: pom.xml not found in repo; unable to resolve version." >&2
                  rm -rf "$tmpdir"
                  echo ""
                  return 0
                fi
                version="$(POM_PATH="$pom_path" GIT_DIR="$tmpdir/.git" VERSION_PREFIX="${VERSION_PREFIX:-}" python3 - <<'PY'
              import os
              import re
              import subprocess
              import sys
              import xml.etree.ElementTree as ET

              path = os.environ.get("POM_PATH", "")
              git_dir = os.environ.get("GIT_DIR", "")
              prefix = os.environ.get("VERSION_PREFIX", "").strip()
              if not path:
                  sys.exit(0)

              def find_text(elem, tag, ns):
                  if ns:
                      found = elem.find(f"{{{ns}}}{tag}")
                  else:
                      found = elem.find(tag)
                  if found is not None and found.text:
                      return found.text.strip()
                  return ""

              def read_pom(pom_path):
                  tree = ET.parse(pom_path)
                  root = tree.getroot()
                  ns = ""
                  if root.tag.startswith("{"):
                      ns = root.tag.split("}")[0].strip("{")
                  version = find_text(root, "version", ns)
                  if not version:
                      parent = root.find(f"{{{ns}}}parent") if ns else root.find("parent")
                      if parent is not None:
                          version = find_text(parent, "version", ns)
                  revision = ""
                  props = root.find(f"{{{ns}}}properties") if ns else root.find("properties")
                  if props is not None:
                      rev_el = props.find(f"{{{ns}}}revision") if ns else props.find("revision")
                      if rev_el is not None and rev_el.text:
                          revision = rev_el.text.strip()
                  return version, revision

              def is_literal(val):
                  return bool(val) and "${" not in val

              version, revision = read_pom(path)
              if is_literal(version):
                  print(version)
                  sys.exit(0)
              if is_literal(revision) and not revision.endswith("-SNAPSHOT"):
                  print(revision)
                  sys.exit(0)

              candidate = revision or version or ""
              if not prefix:
                  match = re.match(r"(\\d+)\\.(\\d+)", candidate)
                  if match:
                      prefix = f"{match.group(1)}.{match.group(2)}."
              if not prefix:
                  sys.exit(0)
              if not prefix.endswith("."):
                  prefix = prefix + "."

              if not git_dir:
                  sys.exit(0)
              try:
                  count = subprocess.check_output(
                      ["git", "--git-dir", git_dir, "rev-list", "--count", "HEAD"],
                      text=True,
                  ).strip()
              except Exception:
                  count = ""
              if not count:
                  sys.exit(0)
              print(prefix + count)
              PY
                )"
                rm -rf "$tmpdir"
                printf '%s' "$version"
              }

              case "$VERSION" in
                ""|"auto"|"latest"|"undefined"|"null")
                  VERSION="$(resolve_repo_version)"
                  ;;
              esac
              if [ -z "$VERSION" ]; then
                echo "ERROR: VERSION not set and could not be resolved. Set VERSION or configure REPO_URL/REPO_BRANCH." >&2
                exit 1
              fi

              echo "Workbench controller: ${WORKBENCH_CONTROLLER_URL}"
              echo "KIE server id: ${KIE_SERVER_ID}"
              echo "Release: ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"

              add_candidate() {
                cand="$1"
                [ -z "$cand" ] && return
                cand="${cand%/}"
                CANDIDATES="${CANDIDATES} ${cand}"
              }
              resolve_controller() {
                base="$1"
                CANDIDATES=""
                add_candidate "$base"
                if ! printf '%s' "$base" | grep -q "/rest/controller$"; then
                  add_candidate "${base%/}/rest/controller"
                fi
                if printf '%s' "$base" | grep -q "/business-central/"; then
                  base_root="${base%/business-central*}"
                  add_candidate "${base_root%/}/rest/controller"
                else
                  add_candidate "${base%/}/business-central/rest/controller"
                fi
                if printf '%s' "$base" | grep -q "/business-central/rest/controller$"; then
                  base_root="${base%/business-central/rest/controller}"
                  add_candidate "${base_root%/}/rest/controller"
                fi
                for cand in $CANDIDATES; do
                  for probe in "management/servers" "management/server-templates" "server"; do
                    code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      "${cand}/${probe}" || true)"
                    echo "Probe ${cand}/${probe} -> HTTP ${code}" >&2
                    if [ "$code" != "404" ]; then
                      echo "$cand"
                      return
                    fi
                  done
                done
                echo "$base"
              }
              WORKBENCH_CONTROLLER_URL="$(resolve_controller "$WORKBENCH_CONTROLLER_URL")"
              echo "Using controller base: ${WORKBENCH_CONTROLLER_URL}"

              CONTROLLER_WAIT_SECONDS="${CONTROLLER_WAIT_SECONDS:-900}"
              CONTROLLER_WAIT_INTERVAL="${CONTROLLER_WAIT_INTERVAL:-5}"
              KIE_SERVER_WAIT_SECONDS="${KIE_SERVER_WAIT_SECONDS:-900}"
              KIE_SERVER_WAIT_INTERVAL="${KIE_SERVER_WAIT_INTERVAL:-5}"

              fetch_servers() {
                ensure_token
                SERVERS_HEADERS="$(mktemp)"
                SERVERS_BODY_FILE="$(mktemp)"
                SERVERS_CODE="$(curl -sS -D "$SERVERS_HEADERS" -o "$SERVERS_BODY_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers" || true)"
                SERVERS_JSON="$(cat "$SERVERS_BODY_FILE")"
                log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers" "$SERVERS_CODE" "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                rm -f "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                if [ "$SERVERS_CODE" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  SERVERS_HEADERS="$(mktemp)"
                  SERVERS_BODY_FILE="$(mktemp)"
                  SERVERS_CODE="$(curl -sS -D "$SERVERS_HEADERS" -o "$SERVERS_BODY_FILE" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    "${WORKBENCH_CONTROLLER_URL}/management/servers" || true)"
                  SERVERS_JSON="$(cat "$SERVERS_BODY_FILE")"
                  log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers" "$SERVERS_CODE" "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                  rm -f "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                fi
              }
              resolve_server_ids() {
                local ids
                ids="$(printf '%s' "$SERVERS_JSON" | jq -r '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  if type=="array" then
                    .[]
                  else
                    templates[]
                  end
                  | (.serverId // .["server-id"] // .id // .["server_id"])
                ' | tr '\n' ' ')"
                if [ -n "$KIE_SERVER_ID_PREFIX" ]; then
                  ids="$(printf '%s' "$ids" | tr ' ' '\n' | grep -E "^${KIE_SERVER_ID_PREFIX}" | tr '\n' ' ')"
                fi
                printf '%s' "$ids"
              }
              count_server_ids() {
                local ids="${1:-}"
                if [ -z "$ids" ]; then
                  printf '0'
                  return 0
                fi
                printf '%s' "$ids" | tr ' ' '\n' | awk 'NF{count++} END {print count+0}'
              }

              echo "Waiting for Workbench controller..."
              WAIT_START="$(date +%s)"
              while true; do
                fetch_servers
                if [ "$SERVERS_CODE" = "200" ]; then
                  echo "Controller ready (HTTP ${SERVERS_CODE})"
                  break
                fi
                now="$(date +%s)"
                if [ $((now - WAIT_START)) -ge "$CONTROLLER_WAIT_SECONDS" ]; then
                  echo "ERROR: Controller not ready after ${CONTROLLER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                  exit 1
                fi
                echo "Controller not ready (HTTP ${SERVERS_CODE}); retrying in ${CONTROLLER_WAIT_INTERVAL}s..."
                sleep "$CONTROLLER_WAIT_INTERVAL"
              done

              TARGET_SERVER_IDS=""
              if [ -n "$KIE_SERVER_IDS" ]; then
                TARGET_SERVER_IDS="$KIE_SERVER_IDS"
              elif [ "${KIE_SERVER_ID}" = "auto" ] || [ -z "$KIE_SERVER_ID" ]; then
                if [ "$KIE_SERVER_MIN_COUNT" -gt 0 ]; then
                  echo "Waiting for at least ${KIE_SERVER_MIN_COUNT} KIE server(s) to register..."
                  WAIT_START="$(date +%s)"
                  while true; do
                    fetch_servers
                    if [ "$SERVERS_CODE" = "200" ]; then
                      TARGET_SERVER_IDS="$(resolve_server_ids)"
                      FOUND_COUNT="$(count_server_ids "$TARGET_SERVER_IDS")"
                      if [ "$FOUND_COUNT" -ge "$KIE_SERVER_MIN_COUNT" ]; then
                        break
                      fi
                    else
                      FOUND_COUNT="0"
                    fi
                    now="$(date +%s)"
                    if [ $((now - WAIT_START)) -ge "$KIE_SERVER_WAIT_SECONDS" ]; then
                      echo "ERROR: Only ${FOUND_COUNT} KIE server(s) registered after ${KIE_SERVER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                      exit 1
                    fi
                    echo "Waiting for ${KIE_SERVER_MIN_COUNT} KIE server(s) (currently ${FOUND_COUNT}); retrying in ${KIE_SERVER_WAIT_INTERVAL}s..."
                    sleep "$KIE_SERVER_WAIT_INTERVAL"
                  done
                else
                  fetch_servers
                  TARGET_SERVER_IDS="$(resolve_server_ids)"
                fi
              else
                TARGET_SERVER_IDS="$KIE_SERVER_ID"
              fi
              if [ -z "$TARGET_SERVER_IDS" ]; then
                echo "ERROR: No KIE server ids resolved for registration"
                exit 1
              fi
              echo "Target KIE server ids: ${TARGET_SERVER_IDS}"

              for KIE_SERVER_ID in $TARGET_SERVER_IDS; do
                echo "----- Registering container for KIE server ${KIE_SERVER_ID} -----"

              echo "Waiting for KIE server registration..."
              WAIT_START="$(date +%s)"
              while true; do
                fetch_servers
                if [ "$SERVERS_CODE" = "200" ] && printf '%s' "$SERVERS_JSON" | jq -e --arg id "$KIE_SERVER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  if type=="array" then
                    any(.[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  else
                    any(templates[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  end' >/dev/null 2>&1; then
                  echo "KIE server ${KIE_SERVER_ID} registered"
                  break
                fi
                now="$(date +%s)"
                if [ $((now - WAIT_START)) -ge "$KIE_SERVER_WAIT_SECONDS" ]; then
                  echo "ERROR: KIE server ${KIE_SERVER_ID} not registered after ${KIE_SERVER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                  exit 1
                fi
                echo "KIE server not registered yet (HTTP ${SERVERS_CODE}); retrying in ${KIE_SERVER_WAIT_INTERVAL}s..."
                sleep "$KIE_SERVER_WAIT_INTERVAL"
              done

              echo "Checking controller server list..."
              echo "Servers response HTTP ${SERVERS_CODE}"
              printf '%s' "$SERVERS_JSON" | head -c 600 || true
              echo
              if [ "$SERVERS_CODE" = "200" ]; then
                if ! printf '%s' "$SERVERS_JSON" | jq -e --arg id "$KIE_SERVER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  if type=="array" then
                    any(.[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  else
                    any(templates[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  end' >/dev/null 2>&1; then
                  echo "ERROR: KIE server id ${KIE_SERVER_ID} not registered with controller"
                  exit 1
                fi
                CONTAINER_STATUS_FOUND="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" --arg cid "$CONTAINER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                    | .["container-specs"][]?
                    | select((.containerId // .["container-id"] // .id) == $cid)
                    | .status][0] // empty' 2>/dev/null || true)"
                CONTAINER_VERSION_FOUND="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" --arg cid "$CONTAINER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                    | .["container-specs"][]?
                    | select((.containerId // .["container-id"] // .id) == $cid)
                    | .["release-id"].version][0] // empty' 2>/dev/null || true)"
                if [ -n "$CONTAINER_STATUS_FOUND" ]; then
                  if [ -n "$CONTAINER_VERSION_FOUND" ]; then
                    echo "Container already registered with status: ${CONTAINER_STATUS_FOUND}, version: ${CONTAINER_VERSION_FOUND}"
                  else
                    echo "Container already registered with status: ${CONTAINER_STATUS_FOUND}"
                  fi
                  if [ "$CONTAINER_STATUS_FOUND" = "$CONTAINER_STATUS" ] && [ "$CONTAINER_VERSION_FOUND" = "$VERSION" ]; then
                    continue
                  fi
                  echo "Container version/status differs; updating registration."
                fi
              fi

              CONTAINER_NAME="${CONTAINER_NAME:-$CONTAINER_ID}"
              SERVER_TEMPLATE_NAME="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" '
                def templates:
                  if type=="object" then
                    (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                  else [] end;
                [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  | (.serverName // .["server-name"] // .name)] | .[0] // empty' 2>/dev/null || true)"
              if [ -z "$SERVER_TEMPLATE_NAME" ]; then
                SERVER_TEMPLATE_NAME="$KIE_SERVER_ID"
              fi

              CONTAINER_ENDPOINT="${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
              EXISTING_HEADERS="$(mktemp)"
              EXISTING_BODY_FILE="$(mktemp)"
              EXISTING_SPEC_CODE="$(curl -sS -D "$EXISTING_HEADERS" -o "$EXISTING_BODY_FILE" -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/json" \
                "$CONTAINER_ENDPOINT" || true)"
              EXISTING_SPEC_JSON="$(cat "$EXISTING_BODY_FILE")"
              log_http_response "GET" "$CONTAINER_ENDPOINT" "$EXISTING_SPEC_CODE" "$EXISTING_HEADERS" "$EXISTING_BODY_FILE"
              rm -f "$EXISTING_HEADERS" "$EXISTING_BODY_FILE"

              if [ "$EXISTING_SPEC_CODE" = "200" ] && [ -n "$EXISTING_SPEC_JSON" ]; then
                if printf '%s' "$EXISTING_SPEC_JSON" | jq -e 'has("container-spec")' >/dev/null 2>&1; then
                  payload="$(printf '%s' "$EXISTING_SPEC_JSON" | jq -c --arg ver "$VERSION" --arg status "$CONTAINER_STATUS" '
                    .["container-spec"]["release-id"].version = $ver
                    | .["container-spec"].status = $status
                  ')"
                else
                  payload="$(printf '%s' "$EXISTING_SPEC_JSON" | jq -c --arg ver "$VERSION" --arg status "$CONTAINER_STATUS" '
                    .["release-id"].version = $ver
                    | .status = $status
                  ')"
                fi
                echo "Using existing container spec from controller"
              else
                payload="$(jq -n \
                  --arg cid "$CONTAINER_ID" \
                  --arg cname "$CONTAINER_NAME" \
                  --arg gid "$GROUP_ID" \
                  --arg aid "$ARTIFACT_ID" \
                  --arg ver "$VERSION" \
                  --arg status "$CONTAINER_STATUS" \
                  --arg sid "$KIE_SERVER_ID" \
                  --arg sname "$SERVER_TEMPLATE_NAME" \
                  '{ "container-id": $cid, "container-name": $cname, "server-template-key": { "server-id": $sid, "server-name": $sname }, "release-id": { "group-id": $gid, "artifact-id": $aid, "version": $ver }, "status": $status, "configuration": {} }')"
                echo "Using generated container spec payload"
              fi

              payload="$(printf '%s' "$payload" | jq -c \
                --arg cname "$CONTAINER_NAME" \
                --arg sid "$KIE_SERVER_ID" \
                --arg sname "$SERVER_TEMPLATE_NAME" '
                if has("container-spec") then
                  .["container-spec"]["container-name"] = $cname
                  | .["container-spec"]["server-template-key"] = {"server-id": $sid, "server-name": $sname}
                else
                  .["container-name"] = $cname
                  | .["server-template-key"] = {"server-id": $sid, "server-name": $sname}
                end
              ')"
              echo "Payload: ${payload}"

              echo "Registering container ${CONTAINER_ID} -> ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"
              echo "Registering via bearer token"
              RESPONSE_FILE="$(mktemp)"
              RESPONSE_HEADERS="$(mktemp)"
              register_request() {
                method="$1"
                url="$2"
                ensure_token
                code="$(curl -sS -D "$RESPONSE_HEADERS" -o "$RESPONSE_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -H "X-KIE-ContentType: JSON" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -X "$method" "$url" \
                  --data-binary "${payload}" || true)"
                if [ "$code" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  code="$(curl -sS -D "$RESPONSE_HEADERS" -o "$RESPONSE_FILE" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -H "X-KIE-ContentType: JSON" \
                    -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -X "$method" "$url" \
                    --data-binary "${payload}" || true)"
                fi
                log_http_response "$method" "$url" "$code" "$RESPONSE_HEADERS" "$RESPONSE_FILE"
                echo "$code"
              }
              print_allow() {
                url="$1"
                echo "Allowed methods for ${url}:" >&2
                curl -sS -D - -o /dev/null -X OPTIONS \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  "$url" | awk -F': ' 'tolower($1)=="allow"{print $2}' | tr -d '\r' >&2 || true
              }

              register_container() {
                HTTP_CODE="$(register_request POST "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}")"
                if [ "$HTTP_CODE" = "405" ] || [ "$HTTP_CODE" = "404" ]; then
                  echo "Controller did not accept POST /management/servers/.../containers/{id}; trying PUT" >&2
                  print_allow "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
                  HTTP_CODE="$(register_request PUT "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}")"
                fi
                echo "$HTTP_CODE"
              }

              delete_container_spec() {
                url="${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
                ensure_token
                del_headers="$(mktemp)"
                del_body="$(mktemp)"
                code="$(curl -sS -D "$del_headers" -o "$del_body" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "X-KIE-ContentType: JSON" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -X DELETE "$url" || true)"
                if [ "$code" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  code="$(curl -sS -D "$del_headers" -o "$del_body" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "X-KIE-ContentType: JSON" \
                    -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -X DELETE "$url" || true)"
                fi
                log_http_response "DELETE" "$url" "$code" "$del_headers" "$del_body"
                rm -f "$del_headers" "$del_body"
                echo "Delete ${url} -> HTTP ${code}" >&2
                case "$code" in
                  200|204|404) return 0 ;;
                esac
                return 1
              }

              HTTP_CODE="$(register_container)"
              if [ "$HTTP_CODE" = "500" ]; then
                echo "Controller returned HTTP 500; attempting delete + recreate"
                delete_container_spec || echo "Warning: delete container spec did not succeed" >&2
                HTTP_CODE="$(register_container)"
              fi

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK: Container registered"
              elif [ "$HTTP_CODE" = "409" ]; then
                echo "OK: Container already registered"
              else
                echo "ERROR: Workbench controller returned HTTP ${HTTP_CODE}"
                echo "Response headers:"
                cat "$RESPONSE_HEADERS"
                echo "Response body:"
                cat "$RESPONSE_FILE"
                rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
                exit 1
              fi

              ensure_token
              VERIFY_HEADERS="$(mktemp)"
              VERIFY_BODY_FILE="$(mktemp)"
              VERIFY_CODE="$(curl -sS -D "$VERIFY_HEADERS" -o "$VERIFY_BODY_FILE" -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/json" \
                "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" || true)"
              VERIFY_JSON="$(cat "$VERIFY_BODY_FILE")"
              if [ "$VERIFY_CODE" = "401" ]; then
                echo "Token rejected by controller; refreshing token and retrying." >&2
                fetch_token
                VERIFY_CODE="$(curl -sS -D "$VERIFY_HEADERS" -o "$VERIFY_BODY_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" || true)"
                VERIFY_JSON="$(cat "$VERIFY_BODY_FILE")"
              fi
              log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" "$VERIFY_CODE" "$VERIFY_HEADERS" "$VERIFY_BODY_FILE"
              rm -f "$VERIFY_HEADERS" "$VERIFY_BODY_FILE"
              if [ "$VERIFY_CODE" = "200" ]; then
                VERIFY_VERSION="$(printf '%s' "$VERIFY_JSON" | jq -r '.["release-id"].version // .["container-spec"]["release-id"].version // empty' 2>/dev/null || true)"
                if [ -n "$VERIFY_VERSION" ]; then
                  echo "Controller reports container version: ${VERIFY_VERSION}"
                fi
                if [ "$VERIFY_VERSION" != "$VERSION" ]; then
                  echo "ERROR: Controller version ${VERIFY_VERSION} does not match expected ${VERSION}"
                  rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
                  exit 1
                fi
              else
                echo "WARNING: Could not verify container spec (HTTP ${VERIFY_CODE})" >&2
              fi
              rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
              done
