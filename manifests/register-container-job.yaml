apiVersion: batch/v1
kind: Job
metadata:
  name: register-kie-container-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    rules.dotcomrow/container-version: "1.0.179"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: drools-rules-service
      restartPolicy: OnFailure
      containers:
        - name: register
          image: hashicorp/vault:1.15.4
          envFrom:
            - configMapRef:
                name: register-container-config-tool-use-policy
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq git python3
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              WORKBENCH_CONTROLLER_URL="${WORKBENCH_CONTROLLER_URL:-}"
              REPO_URL="${REPO_URL:-}"
              REPO_BRANCH="${REPO_BRANCH:-}"
              KIE_SERVER_ID="${KIE_SERVER_ID:-}"
              KIE_SERVER_IDS="${KIE_SERVER_IDS:-}"
              KIE_SERVER_ID_PREFIX="${KIE_SERVER_ID_PREFIX:-}"
              KIE_SERVER_MIN_COUNT="${KIE_SERVER_MIN_COUNT:-0}"
              CONTAINER_ID="${CONTAINER_ID:-}"
              GROUP_ID="${GROUP_ID:-}"
              ARTIFACT_ID="${ARTIFACT_ID:-}"
              VERSION="${VERSION:-}"
              VERSION_PREFIX="${VERSION_PREFIX:-}"
              MAVEN_REPO_URL="${MAVEN_REPO_URL:-}"
              REQUIRE_PUBLISHED_VERSION="${REQUIRE_PUBLISHED_VERSION:-false}"
              FALLBACK_TO_LATEST_PUBLISHED="${FALLBACK_TO_LATEST_PUBLISHED:-true}"
              PUBLISHED_VERSION_WAIT_SECONDS="${PUBLISHED_VERSION_WAIT_SECONDS:-1200}"
              PUBLISHED_VERSION_POLL_SECONDS="${PUBLISHED_VERSION_POLL_SECONDS:-15}"
              CLEANUP_OLD_VERSIONS="${CLEANUP_OLD_VERSIONS:-false}"
              FORCE_REDEPLOY="${FORCE_REDEPLOY:-false}"
              CONTAINER_STATUS="${CONTAINER_STATUS:-STARTED}"
              DEPLOY_TO_KIE_SERVER_REST="${DEPLOY_TO_KIE_SERVER_REST:-true}"
              KIE_SERVER_REST_BASE_URL_TEMPLATE="${KIE_SERVER_REST_BASE_URL_TEMPLATE:-}"
              KIE_SERVER_REST_SCHEME="${KIE_SERVER_REST_SCHEME:-http}"
              KIE_SERVER_REST_HEADLESS_SERVICE="${KIE_SERVER_REST_HEADLESS_SERVICE:-kie-server-headless}"
              KIE_SERVER_REST_NAMESPACE="${KIE_SERVER_REST_NAMESPACE:-drools}"
              KIE_SERVER_REST_PORT="${KIE_SERVER_REST_PORT:-8080}"
              KIE_SERVER_REST_CONTEXT_PATH="${KIE_SERVER_REST_CONTEXT_PATH:-/kie-server/services/rest/server}"
              KIE_SERVER_REST_AUTH_MODE="${KIE_SERVER_REST_AUTH_MODE:-bearer}"
              KIE_SERVER_REST_CREDS_PATH="${KIE_SERVER_REST_CREDS_PATH:-secret/drools/admin}"
              KIE_SERVER_REST_WAIT_SECONDS="${KIE_SERVER_REST_WAIT_SECONDS:-900}"
              KIE_SERVER_REST_WAIT_INTERVAL="${KIE_SERVER_REST_WAIT_INTERVAL:-5}"
              is_true() {
                case "${1:-}" in
                  1|true|TRUE|yes|YES|y|Y) return 0 ;;
                  *) return 1 ;;
                esac
              }
              if ! printf '%s' "$PUBLISHED_VERSION_WAIT_SECONDS" | grep -q '^[0-9][0-9]*$'; then
                echo "ERROR: PUBLISHED_VERSION_WAIT_SECONDS must be a non-negative integer"
                exit 1
              fi
              if ! printf '%s' "$PUBLISHED_VERSION_POLL_SECONDS" | grep -q '^[1-9][0-9]*$'; then
                echo "ERROR: PUBLISHED_VERSION_POLL_SECONDS must be a positive integer"
                exit 1
              fi
              if ! printf '%s' "$KIE_SERVER_MIN_COUNT" | grep -q '^[0-9][0-9]*$'; then
                echo "ERROR: KIE_SERVER_MIN_COUNT must be a non-negative integer"
                exit 1
              fi
              if ! printf '%s' "$KIE_SERVER_REST_WAIT_SECONDS" | grep -q '^[0-9][0-9]*$'; then
                echo "ERROR: KIE_SERVER_REST_WAIT_SECONDS must be a non-negative integer"
                exit 1
              fi
              if ! printf '%s' "$KIE_SERVER_REST_WAIT_INTERVAL" | grep -q '^[1-9][0-9]*$'; then
                echo "ERROR: KIE_SERVER_REST_WAIT_INTERVAL must be a positive integer"
                exit 1
              fi
              if [ -z "$WORKBENCH_CONTROLLER_URL" ] || [ -z "$CONTAINER_ID" ] || [ -z "$GROUP_ID" ] || [ -z "$ARTIFACT_ID" ] || ( [ -z "$KIE_SERVER_ID" ] && [ -z "$KIE_SERVER_IDS" ] ); then
                echo "ERROR: Missing registration config (WORKBENCH_CONTROLLER_URL, KIE_SERVER_ID or KIE_SERVER_IDS, CONTAINER_ID, GROUP_ID, ARTIFACT_ID)"
                exit 1
              fi

              echo "Vault login ok. Fetching Keycloak Workbench client and controller credentials"
              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              if [ -n "$KC_CLIENT_ID" ]; then
                echo "Keycloak client id: ${KC_CLIENT_ID}"
              else
                echo "Keycloak client id missing"
              fi
              if [ -n "$KC_CLIENT_SECRET" ]; then
                echo "Keycloak client secret length: ${#KC_CLIENT_SECRET}"
              else
                echo "Keycloak client secret missing"
              fi
              TOKEN=""
              TOKEN_EXPIRES_AT=""
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi
              GH_USER=""
              GH_TOKEN=""
              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username 2>/dev/null || true)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token 2>/dev/null || true)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN" ]; then
                echo "WARN: GitHub credentials not found; attempting anonymous repo access."
              fi
              TOKEN_URL="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token"
              TOKEN_REFRESH_SKEW="${TOKEN_REFRESH_SKEW:-30}"
              fetch_token() {
                TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "grant_type=client_credentials" \
                  --data-urlencode "client_id=${KC_CLIENT_ID}" \
                  --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                  "$TOKEN_URL" || true)"
                TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
                TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
                if [ "$TOKEN_CODE" = "200" ]; then
                  TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
                  EXPIRES_IN="$(printf '%s' "$TOKEN_BODY" | jq -r '.expires_in // empty')"
                  if [ -z "${EXPIRES_IN:-}" ] || ! printf '%s' "$EXPIRES_IN" | grep -q '^[0-9][0-9]*$'; then
                    EXPIRES_IN="300"
                  fi
                  now="$(date +%s)"
                  TOKEN_EXPIRES_AT=$((now + EXPIRES_IN - TOKEN_REFRESH_SKEW))
                  if [ "$TOKEN_EXPIRES_AT" -le "$now" ]; then
                    TOKEN_EXPIRES_AT=$((now + EXPIRES_IN))
                  fi
                  if [ -n "$TOKEN" ]; then
                    echo "Keycloak token acquired (expires in ${EXPIRES_IN}s)"
                  else
                    echo "Keycloak token missing in response"
                  fi
                else
                  TOKEN_ERROR="$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty')"
                  TOKEN_ERROR_DESC="$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty')"
                  echo "Keycloak token request failed: HTTP ${TOKEN_CODE} ${TOKEN_ERROR}${TOKEN_ERROR_DESC:+ - }${TOKEN_ERROR_DESC}"
                fi
                if [ -z "$TOKEN" ]; then
                  echo "ERROR: Could not obtain Keycloak token"
                  exit 1
                fi
              }
              ensure_token() {
                now="$(date +%s)"
                if [ -z "${TOKEN:-}" ] || [ -z "${TOKEN_EXPIRES_AT:-}" ] || [ "$now" -ge "$TOKEN_EXPIRES_AT" ]; then
                  fetch_token
                fi
              }
              fetch_token

              LOG_HTTP="${LOG_HTTP:-true}"
              LOG_HTTP_ONLY_ERRORS="${LOG_HTTP_ONLY_ERRORS:-true}"
              LOG_HTTP_BODY_MAX="${LOG_HTTP_BODY_MAX:-1200}"

              log_http_response() {
                local method="$1"
                local url="$2"
                local code="$3"
                local headers_file="${4:-}"
                local body_file="${5:-}"
                if [ "${LOG_HTTP:-false}" != "true" ]; then
                  return 0
                fi
                if [ "${LOG_HTTP_ONLY_ERRORS:-true}" = "true" ]; then
                  case "$code" in
                    2*|3*) return 0 ;;
                  esac
                fi
                echo "HTTP ${method} ${url} -> ${code}" >&2
                if [ -n "$headers_file" ] && [ -f "$headers_file" ]; then
                  echo "Response headers:" >&2
                  sed -e 's/^Set-Cookie:.*/Set-Cookie: REDACTED/' "$headers_file" | tr -d '\r' >&2
                fi
                if [ -n "$body_file" ] && [ -f "$body_file" ]; then
                  echo "Response body (first ${LOG_HTTP_BODY_MAX} bytes):" >&2
                  head -c "$LOG_HTTP_BODY_MAX" "$body_file" >&2
                  echo >&2
                fi
              }

              git_auth_header() {
                if [ -z "${GH_USER:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
                  return 0
                fi
                printf '%s' "$GH_USER:$GH_TOKEN" | base64 | tr -d '\n'
              }

              resolve_repo_version() {
                if [ -z "$REPO_URL" ]; then
                  echo ""
                  return 0
                fi
                tmpdir="$(mktemp -d)"
                auth_header="$(git_auth_header)"
                if [ -n "$auth_header" ]; then
                  if ! GIT_TERMINAL_PROMPT=0 git -c http.extraHeader="Authorization: Basic ${auth_header}" clone "$REPO_URL" "$tmpdir"; then
                    echo "WARN: Failed to clone repo for version resolution." >&2
                    rm -rf "$tmpdir"
                    echo ""
                    return 0
                  fi
                else
                  if ! GIT_TERMINAL_PROMPT=0 git clone "$REPO_URL" "$tmpdir"; then
                    echo "WARN: Failed to clone repo for version resolution." >&2
                    rm -rf "$tmpdir"
                    echo ""
                    return 0
                  fi
                fi
                branch=""
                for candidate in "${REPO_BRANCH:-}" prod main master; do
                  [ -n "$candidate" ] || continue
                  if git -C "$tmpdir" show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
                    branch="$candidate"
                    break
                  fi
                  if git -C "$tmpdir" show-ref --verify --quiet "refs/heads/$candidate"; then
                    branch="$candidate"
                    break
                  fi
                done
                if [ -n "$branch" ]; then
                  git -C "$tmpdir" checkout -f "$branch" >/dev/null 2>&1 || true
                fi
                pom_path="$tmpdir/pom.xml"
                if [ ! -f "$pom_path" ]; then
                  echo "WARN: pom.xml not found in repo; unable to resolve version." >&2
                  rm -rf "$tmpdir"
                  echo ""
                  return 0
                fi
                version="$(POM_PATH="$pom_path" GIT_DIR="$tmpdir/.git" VERSION_PREFIX="${VERSION_PREFIX:-}" python3 - <<'PY'
              import os
              import re
              import subprocess
              import sys
              import xml.etree.ElementTree as ET

              path = os.environ.get("POM_PATH", "")
              git_dir = os.environ.get("GIT_DIR", "")
              prefix = os.environ.get("VERSION_PREFIX", "").strip()
              if not path:
                  sys.exit(0)

              def find_text(elem, tag, ns):
                  if ns:
                      found = elem.find(f"{{{ns}}}{tag}")
                  else:
                      found = elem.find(tag)
                  if found is not None and found.text:
                      return found.text.strip()
                  return ""

              def read_pom(pom_path):
                  tree = ET.parse(pom_path)
                  root = tree.getroot()
                  ns = ""
                  if root.tag.startswith("{"):
                      ns = root.tag.split("}")[0].strip("{")
                  version = find_text(root, "version", ns)
                  if not version:
                      parent = root.find(f"{{{ns}}}parent") if ns else root.find("parent")
                      if parent is not None:
                          version = find_text(parent, "version", ns)
                  revision = ""
                  props = root.find(f"{{{ns}}}properties") if ns else root.find("properties")
                  if props is not None:
                      rev_el = props.find(f"{{{ns}}}revision") if ns else props.find("revision")
                      if rev_el is not None and rev_el.text:
                          revision = rev_el.text.strip()
                  return version, revision

              def is_literal(val):
                  return bool(val) and "${" not in val

              version, revision = read_pom(path)
              if is_literal(version):
                  print(version)
                  sys.exit(0)
              if is_literal(revision) and not revision.endswith("-SNAPSHOT"):
                  print(revision)
                  sys.exit(0)

              candidate = revision or version or ""
              if not prefix:
                  match = re.match(r"(\d+)\.(\d+)", candidate)
                  if match:
                      prefix = f"{match.group(1)}.{match.group(2)}."
              if not prefix:
                  sys.exit(0)
              if not prefix.endswith("."):
                  prefix = prefix + "."

              if not git_dir:
                  sys.exit(0)
              try:
                  count = subprocess.check_output(
                      ["git", "--git-dir", git_dir, "rev-list", "--count", "HEAD"],
                      text=True,
                  ).strip()
              except Exception:
                  count = ""
              if not count:
                  sys.exit(0)
              print(prefix + count)
              PY
                )"
                rm -rf "$tmpdir"
                printf '%s' "$version"
              }

              case "$VERSION" in
                ""|"auto"|"latest"|"undefined"|"null")
                  VERSION="$(resolve_repo_version)"
                  ;;
              esac
              if [ -z "$VERSION" ]; then
                echo "ERROR: VERSION not set and could not be resolved. Set VERSION or configure REPO_URL/REPO_BRANCH." >&2
                exit 1
              fi

              fetch_maven_metadata() {
                if [ -z "${MAVEN_REPO_URL:-}" ] || [ -z "${GROUP_ID:-}" ] || [ -z "${ARTIFACT_ID:-}" ]; then
                  return 1
                fi
                repo="${MAVEN_REPO_URL%/}"
                group_path="$(printf '%s' "$GROUP_ID" | tr '.' '/')"
                metadata_url="${repo}/${group_path}/${ARTIFACT_ID}/maven-metadata.xml"
                echo "Checking published versions at ${metadata_url}" >&2
                auth_arg=""
                if [ -n "${GH_USER:-}" ] && [ -n "${GH_TOKEN:-}" ]; then
                  auth_arg="-u ${GH_USER}:${GH_TOKEN}"
                fi
                metadata="$(curl -fsSL $auth_arg "$metadata_url" || true)"
                if [ -z "$metadata" ]; then
                  echo "WARN: Unable to fetch maven metadata; skipping publish check."
                  return 1
                fi
                printf '%s' "$metadata"
              }

              if [ -n "${MAVEN_REPO_URL:-}" ]; then
                parse_metadata() {
                  xml_text="$1"
                  desired="$2"
                  [ -z "$xml_text" ] && return 1
                  export METADATA_XML="$xml_text"
                  export DESIRED_VERSION="$desired"
                  RESULT="$(python3 - <<'PY'
              import os
              import sys
              import xml.etree.ElementTree as ET

              xml_text = os.environ.get("METADATA_XML", "")
              desired = os.environ.get("DESIRED_VERSION", "")
              if not xml_text:
                sys.exit(0)
              try:
                root = ET.fromstring(xml_text)
              except ET.ParseError:
                sys.exit(0)

              versions = [el.text.strip() for el in root.findall("./versioning/versions/version") if el.text]
              latest = ""
              latest_el = root.find("./versioning/latest")
              if latest_el is not None and latest_el.text:
                latest = latest_el.text.strip()
              if not latest and versions:
                latest = versions[-1]

              desired_present = desired in versions
              print("latest=" + latest)
              print("has=" + ("true" if desired_present else "false"))
              PY
                  )"
                  PUBLISHED_LATEST="$(printf '%s' "$RESULT" | awk -F= '/^latest=/{print $2}')"
                  PUBLISHED_HAS_DESIRED="$(printf '%s' "$RESULT" | awk -F= '/^has=/{print $2}')"
                }

                METADATA_XML="$(fetch_maven_metadata || true)"
                PUBLISHED_LATEST=""
                PUBLISHED_HAS_DESIRED=""
                parse_metadata "${METADATA_XML:-}" "$VERSION" || true

                if [ -n "${PUBLISHED_HAS_DESIRED:-}" ] && [ "${PUBLISHED_HAS_DESIRED}" != "true" ] && [ "${PUBLISHED_VERSION_WAIT_SECONDS}" -gt 0 ]; then
                  echo "Desired version ${VERSION} not published yet; waiting up to ${PUBLISHED_VERSION_WAIT_SECONDS}s..." >&2
                  start_ts="$(date +%s)"
                  while true; do
                    now_ts="$(date +%s)"
                    elapsed="$((now_ts - start_ts))"
                    if [ "$elapsed" -ge "$PUBLISHED_VERSION_WAIT_SECONDS" ]; then
                      break
                    fi
                    sleep "$PUBLISHED_VERSION_POLL_SECONDS"
                    METADATA_XML="$(fetch_maven_metadata || true)"
                    parse_metadata "${METADATA_XML:-}" "$VERSION" || true
                    if [ -n "${PUBLISHED_HAS_DESIRED:-}" ] && [ "${PUBLISHED_HAS_DESIRED}" = "true" ]; then
                      echo "Desired version ${VERSION} is now published." >&2
                      break
                    fi
                  done
                fi

                if [ -n "${PUBLISHED_HAS_DESIRED:-}" ] && [ "${PUBLISHED_HAS_DESIRED}" != "true" ]; then
                  if [ "${FALLBACK_TO_LATEST_PUBLISHED}" = "true" ] && [ -n "$PUBLISHED_LATEST" ]; then
                    echo "WARN: Desired version ${VERSION} not published; falling back to ${PUBLISHED_LATEST}."
                    VERSION="$PUBLISHED_LATEST"
                  elif [ "${REQUIRE_PUBLISHED_VERSION}" = "true" ]; then
                    echo "ERROR: Desired version ${VERSION} not published. Latest published is ${PUBLISHED_LATEST:-unknown}." >&2
                    exit 1
                  else
                    echo "WARN: Desired version ${VERSION} not published; continuing anyway."
                  fi
                fi
              fi

              echo "Workbench controller: ${WORKBENCH_CONTROLLER_URL}"
              echo "KIE server id: ${KIE_SERVER_ID}"
              echo "Release: ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"

              add_candidate() {
                cand="$1"
                [ -z "$cand" ] && return
                cand="${cand%/}"
                CANDIDATES="${CANDIDATES} ${cand}"
              }
              resolve_controller() {
                base="$1"
                CANDIDATES=""
                add_candidate "$base"
                if ! printf '%s' "$base" | grep -q "/rest/controller$"; then
                  add_candidate "${base%/}/rest/controller"
                fi
                if printf '%s' "$base" | grep -q "/business-central/"; then
                  base_root="${base%/business-central*}"
                  add_candidate "${base_root%/}/rest/controller"
                else
                  add_candidate "${base%/}/business-central/rest/controller"
                fi
                if printf '%s' "$base" | grep -q "/business-central/rest/controller$"; then
                  base_root="${base%/business-central/rest/controller}"
                  add_candidate "${base_root%/}/rest/controller"
                fi
                for cand in $CANDIDATES; do
                  for probe in "management/servers" "management/server-templates" "server"; do
                    code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      "${cand}/${probe}" || true)"
                    echo "Probe ${cand}/${probe} -> HTTP ${code}" >&2
                    if [ "$code" != "404" ]; then
                      echo "$cand"
                      return
                    fi
                  done
                done
                echo "$base"
              }
              WORKBENCH_CONTROLLER_URL="$(resolve_controller "$WORKBENCH_CONTROLLER_URL")"
              echo "Using controller base: ${WORKBENCH_CONTROLLER_URL}"

              CONTROLLER_WAIT_SECONDS="${CONTROLLER_WAIT_SECONDS:-900}"
              CONTROLLER_WAIT_INTERVAL="${CONTROLLER_WAIT_INTERVAL:-5}"
              KIE_SERVER_WAIT_SECONDS="${KIE_SERVER_WAIT_SECONDS:-900}"
              KIE_SERVER_WAIT_INTERVAL="${KIE_SERVER_WAIT_INTERVAL:-5}"

              fetch_servers() {
                ensure_token
                SERVERS_HEADERS="$(mktemp)"
                SERVERS_BODY_FILE="$(mktemp)"
                SERVERS_CODE="$(curl -sS -D "$SERVERS_HEADERS" -o "$SERVERS_BODY_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers" || true)"
                SERVERS_JSON="$(cat "$SERVERS_BODY_FILE")"
                log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers" "$SERVERS_CODE" "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                rm -f "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                if [ "$SERVERS_CODE" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  SERVERS_HEADERS="$(mktemp)"
                  SERVERS_BODY_FILE="$(mktemp)"
                  SERVERS_CODE="$(curl -sS -D "$SERVERS_HEADERS" -o "$SERVERS_BODY_FILE" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    "${WORKBENCH_CONTROLLER_URL}/management/servers" || true)"
                  SERVERS_JSON="$(cat "$SERVERS_BODY_FILE")"
                  log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers" "$SERVERS_CODE" "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                  rm -f "$SERVERS_HEADERS" "$SERVERS_BODY_FILE"
                fi
              }
              resolve_server_ids() {
                local ids
                ids="$(printf '%s' "$SERVERS_JSON" | jq -r '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  if type=="array" then
                    .[]
                  else
                    templates[]
                  end
                  | (.serverId // .["server-id"] // .id // .["server_id"])
                ' | tr '\n' ' ')"
                if [ -n "$KIE_SERVER_ID_PREFIX" ]; then
                  ids="$(printf '%s' "$ids" | tr ' ' '\n' | grep -E "^${KIE_SERVER_ID_PREFIX}" | tr '\n' ' ')"
                fi
                printf '%s' "$ids"
              }
              count_server_ids() {
                local ids="${1:-}"
                if [ -z "$ids" ]; then
                  printf '0'
                  return 0
                fi
                printf '%s' "$ids" | tr ' ' '\n' | awk 'NF{count++} END {print count+0}'
              }
              generate_statefulset_ids() {
                prefix="$1"
                count="$2"
                i=0
                out=""
                while [ "$i" -lt "$count" ]; do
                  out="${out}${prefix}${i} "
                  i=$((i + 1))
                done
                printf '%s' "$out"
              }

              echo "Waiting for Workbench controller..."
              WAIT_START="$(date +%s)"
              while true; do
                fetch_servers
                if [ "$SERVERS_CODE" = "200" ]; then
                  echo "Controller ready (HTTP ${SERVERS_CODE})"
                  break
                fi
                now="$(date +%s)"
                if [ $((now - WAIT_START)) -ge "$CONTROLLER_WAIT_SECONDS" ]; then
                  if is_true "${DEPLOY_TO_KIE_SERVER_REST}"; then
                    echo "WARN: Controller not ready after ${CONTROLLER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE}); continuing because DEPLOY_TO_KIE_SERVER_REST=true"
                    break
                  fi
                  echo "ERROR: Controller not ready after ${CONTROLLER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                  exit 1
                fi
                echo "Controller not ready (HTTP ${SERVERS_CODE}); retrying in ${CONTROLLER_WAIT_INTERVAL}s..."
                sleep "$CONTROLLER_WAIT_INTERVAL"
              done

              TARGET_SERVER_IDS=""
              if [ -n "$KIE_SERVER_IDS" ]; then
                TARGET_SERVER_IDS="$(printf '%s' "$KIE_SERVER_IDS" | tr ',' ' ')"
              elif [ "${KIE_SERVER_ID}" = "auto" ] || [ -z "$KIE_SERVER_ID" ]; then
                if [ "$KIE_SERVER_MIN_COUNT" -gt 0 ]; then
                  echo "Waiting for at least ${KIE_SERVER_MIN_COUNT} KIE server(s) to register..."
                  WAIT_START="$(date +%s)"
                  while true; do
                    fetch_servers
                    if [ "$SERVERS_CODE" = "200" ]; then
                      TARGET_SERVER_IDS="$(resolve_server_ids)"
                      FOUND_COUNT="$(count_server_ids "$TARGET_SERVER_IDS")"
                      if [ "$FOUND_COUNT" -ge "$KIE_SERVER_MIN_COUNT" ]; then
                        break
                      fi
                    else
                      FOUND_COUNT="0"
                    fi
                    now="$(date +%s)"
                    if [ $((now - WAIT_START)) -ge "$KIE_SERVER_WAIT_SECONDS" ]; then
                      if [ "${DEPLOY_TO_KIE_SERVER_REST}" = "true" ]; then
                        echo "WARN: Only ${FOUND_COUNT} KIE server(s) registered after ${KIE_SERVER_WAIT_SECONDS}s; falling back to StatefulSet ids (${KIE_SERVER_ID_PREFIX}0..$((KIE_SERVER_MIN_COUNT - 1))) because DEPLOY_TO_KIE_SERVER_REST=true"
                        TARGET_SERVER_IDS="$(generate_statefulset_ids "$KIE_SERVER_ID_PREFIX" "$KIE_SERVER_MIN_COUNT")"
                        break
                      fi
                      echo "ERROR: Only ${FOUND_COUNT} KIE server(s) registered after ${KIE_SERVER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                      exit 1
                    fi
                    echo "Waiting for ${KIE_SERVER_MIN_COUNT} KIE server(s) (currently ${FOUND_COUNT}); retrying in ${KIE_SERVER_WAIT_INTERVAL}s..."
                    sleep "$KIE_SERVER_WAIT_INTERVAL"
                  done
                else
                  fetch_servers
                  TARGET_SERVER_IDS="$(resolve_server_ids)"
                  if [ -z "$TARGET_SERVER_IDS" ] && [ "${DEPLOY_TO_KIE_SERVER_REST}" = "true" ] && [ "$KIE_SERVER_MIN_COUNT" -gt 0 ]; then
                    echo "WARN: Controller returned no server ids; using StatefulSet ids (${KIE_SERVER_ID_PREFIX}0..$((KIE_SERVER_MIN_COUNT - 1))) because DEPLOY_TO_KIE_SERVER_REST=true"
                    TARGET_SERVER_IDS="$(generate_statefulset_ids "$KIE_SERVER_ID_PREFIX" "$KIE_SERVER_MIN_COUNT")"
                  fi
                fi
              else
                TARGET_SERVER_IDS="$KIE_SERVER_ID"
              fi
              if [ -z "$TARGET_SERVER_IDS" ]; then
                echo "ERROR: No KIE server ids resolved for registration"
                exit 1
              fi
              echo "Target KIE server ids: ${TARGET_SERVER_IDS}"

              kie_server_base_url() {
                id="$1"
                # Prefer controller-provided server-url when available (it may point at an auth proxy).
                if [ "${SERVERS_CODE:-}" = "200" ] && [ -n "${SERVERS_JSON:-}" ]; then
                  url="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$id" '
                    def templates:
                      if type=="object" then
                        (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                      else [] end;
                    [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                      | .["server-instances"][]?
                      | .["server-url"]][0] // empty' 2>/dev/null || true)"
                  if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
                    printf '%s' "$url"
                    return 0
                  fi
                fi
                if [ -n "${KIE_SERVER_REST_BASE_URL_TEMPLATE:-}" ]; then
                  printf '%s' "$KIE_SERVER_REST_BASE_URL_TEMPLATE" | sed "s/{id}/${id}/g"
                  return 0
                fi
                ctx="${KIE_SERVER_REST_CONTEXT_PATH:-/kie-server/services/rest/server}"
                case "$ctx" in
                  /*) ;;
                  *) ctx="/${ctx}" ;;
                esac
                printf '%s' "${KIE_SERVER_REST_SCHEME}://${id}.${KIE_SERVER_REST_HEADLESS_SERVICE}.${KIE_SERVER_REST_NAMESPACE}.svc.cluster.local:${KIE_SERVER_REST_PORT}${ctx}"
              }
              fetch_kie_server_rest_creds() {
                path="$1"
                json="$(vault kv get -format=json "$path" 2>/dev/null || true)"
                user="$(printf '%s' "$json" | jq -r '.data.data.username // .data.data.user // empty' 2>/dev/null || true)"
                pass="$(printf '%s' "$json" | jq -r '.data.data.password // .data.data.pass // empty' 2>/dev/null || true)"
                if [ -z "${user:-}" ] || [ -z "${pass:-}" ]; then
                  echo "ERROR: Missing username/password at Vault path ${path}"
                  exit 1
                fi
                KIE_SERVER_REST_USER="$user"
                KIE_SERVER_REST_PASS="$pass"
              }
              wait_for_kie_server_rest() {
                id="$1"
                base="$2"
                wait_start="$(date +%s)"
                while true; do
                  if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                    ensure_token
                    code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      "$base" || true)"
                    if [ "$code" = "401" ]; then
                      fetch_token
                      code="$(curl -sS -o /dev/null -w '%{http_code}' \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        "$base" || true)"
                    fi
                  else
                    code="$(curl -sS -o /dev/null -w '%{http_code}' -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                      -H "Accept: application/json" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      "$base" || true)"
                  fi
                  if [ "$code" = "200" ]; then
                    return 0
                  fi
                  if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                    echo "ERROR: KIE server REST auth failed (HTTP ${code}) at ${base}"
                    return 1
                  fi
                  now="$(date +%s)"
                  if [ $((now - wait_start)) -ge "$KIE_SERVER_REST_WAIT_SECONDS" ]; then
                    echo "ERROR: KIE server REST not ready after ${KIE_SERVER_REST_WAIT_SECONDS}s (last HTTP ${code}) at ${base}"
                    return 1
                  fi
                  echo "KIE server REST not ready (HTTP ${code}) at ${base}; retrying in ${KIE_SERVER_REST_WAIT_INTERVAL}s..."
                  sleep "$KIE_SERVER_REST_WAIT_INTERVAL"
                done
              }
              deploy_container_via_kie_rest() {
                id="$1"
                base="$(kie_server_base_url "$id")"
                echo "Deploying container to ${id} via KIE Server REST: ${base}"
                wait_for_kie_server_rest "$id" "$base"

                body="$(mktemp)"
                if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                  ensure_token
                  code="$(curl -sS \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "X-KIE-Server-Id: ${id}" \
                    -H "KIE-Server-Id: ${id}" \
                    -o "$body" -w '%{http_code}' \
                    "${base}/containers/${CONTAINER_ID}" || true)"
                  if [ "$code" = "401" ]; then
                    fetch_token
                    code="$(curl -sS \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      -o "$body" -w '%{http_code}' \
                      "${base}/containers/${CONTAINER_ID}" || true)"
                  fi
                else
                  code="$(curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                    -H "Accept: application/json" \
                    -H "X-KIE-Server-Id: ${id}" \
                    -H "KIE-Server-Id: ${id}" \
                    -o "$body" -w '%{http_code}' \
                    "${base}/containers/${CONTAINER_ID}" || true)"
                fi
                json="$(cat "$body" 2>/dev/null || true)"
                rm -f "$body"
                existing_type="$(printf '%s' "$json" | jq -r '.type // empty' 2>/dev/null || true)"
                existing_version="$(printf '%s' "$json" | jq -r '.result["kie-container"]["release-id"].version // .result["kie-container"]["resolved-release-id"].version // empty' 2>/dev/null || true)"
                has_container="false"
                if [ "$code" = "200" ] && [ "$existing_type" = "SUCCESS" ]; then
                  has_container="true"
                fi
                NEED_CREATE="true"
                if [ "$has_container" = "true" ]; then
                  echo "KIE server ${id} has container ${CONTAINER_ID} version ${existing_version:-unknown}"
                  if [ "${FORCE_REDEPLOY}" != "true" ] && [ "$existing_version" = "$VERSION" ]; then
                    echo "KIE server container already at desired version; skipping create."
                    NEED_CREATE="false"
                  else
                    echo "Deleting existing KIE server container before deploy..."
                    del_body="$(mktemp)"
                    if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                      ensure_token
                      del_code="$(curl -sS \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -o "$del_body" -w '%{http_code}' -X DELETE \
                        "${base}/containers/${CONTAINER_ID}" || true)"
                      if [ "$del_code" = "401" ]; then
                        fetch_token
                        del_code="$(curl -sS \
                          -H "Authorization: Bearer ${TOKEN}" \
                          -H "Accept: application/json" \
                          -H "X-KIE-Server-Id: ${id}" \
                          -H "KIE-Server-Id: ${id}" \
                          -o "$del_body" -w '%{http_code}' -X DELETE \
                          "${base}/containers/${CONTAINER_ID}" || true)"
                      fi
                    else
                      del_code="$(curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -o "$del_body" -w '%{http_code}' -X DELETE \
                        "${base}/containers/${CONTAINER_ID}" || true)"
                    fi
                    rm -f "$del_body"
                    case "$del_code" in
                      200|204|404) ;;
                      *) echo "ERROR: Failed to delete container on ${id} (HTTP ${del_code})"; return 1 ;;
                    esac
                  fi
                fi

                payload="$(jq -n \
                  --arg cid "$CONTAINER_ID" \
                  --arg gid "$GROUP_ID" \
                  --arg aid "$ARTIFACT_ID" \
                  --arg ver "$VERSION" \
                  '{ "container-id": $cid, "release-id": { "group-id": $gid, "artifact-id": $aid, "version": $ver } }')"

                if [ "$NEED_CREATE" = "true" ]; then
                  put_body="$(mktemp)"
                  if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                    ensure_token
                    put_code="$(curl -sS \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -H "Content-Type: application/json" \
                      -H "X-KIE-ContentType: JSON" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      -o "$put_body" -w '%{http_code}' -X PUT \
                      "${base}/containers/${CONTAINER_ID}" \
                      --data-binary "$payload" || true)"
                    if [ "$put_code" = "401" ]; then
                      fetch_token
                      put_code="$(curl -sS \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "Content-Type: application/json" \
                        -H "X-KIE-ContentType: JSON" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -o "$put_body" -w '%{http_code}' -X PUT \
                        "${base}/containers/${CONTAINER_ID}" \
                        --data-binary "$payload" || true)"
                    fi
                  else
                    put_code="$(curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                      -H "Accept: application/json" \
                      -H "Content-Type: application/json" \
                      -H "X-KIE-ContentType: JSON" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      -o "$put_body" -w '%{http_code}' -X PUT \
                      "${base}/containers/${CONTAINER_ID}" \
                      --data-binary "$payload" || true)"
                  fi
                  put_json="$(cat "$put_body" 2>/dev/null || true)"
                  rm -f "$put_body"
                  put_type="$(printf '%s' "$put_json" | jq -r '.type // empty' 2>/dev/null || true)"
                  if [ "$put_code" -lt 200 ] || [ "$put_code" -ge 300 ] || [ "$put_type" != "SUCCESS" ]; then
                    echo "ERROR: Failed to deploy container on ${id} (HTTP ${put_code}, type=${put_type:-?})"
                    printf '%s\n' "$put_json" | head -c 2000 || true
                    echo
                    return 1
                  fi
                fi

                case "$CONTAINER_STATUS" in
                  STARTED|started|ACTIVATED|activated)
                    if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                      ensure_token
                      curl -sS \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -X PUT "${base}/containers/${CONTAINER_ID}/status/activated" >/dev/null 2>&1 || true
                    else
                      curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -X PUT "${base}/containers/${CONTAINER_ID}/status/activated" >/dev/null 2>&1 || true
                    fi
                    ;;
                  STOPPED|stopped|DEACTIVATED|deactivated)
                    if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                      ensure_token
                      curl -sS \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -X PUT "${base}/containers/${CONTAINER_ID}/status/deactivated" >/dev/null 2>&1 || true
                    else
                      curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -X PUT "${base}/containers/${CONTAINER_ID}/status/deactivated" >/dev/null 2>&1 || true
                    fi
                    ;;
                esac

                verify_start="$(date +%s)"
                while true; do
                  verify_body="$(mktemp)"
                  if [ "$KIE_SERVER_REST_AUTH_MODE" = "bearer" ]; then
                    ensure_token
                    verify_code="$(curl -sS \
                      -H "Authorization: Bearer ${TOKEN}" \
                      -H "Accept: application/json" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      -o "$verify_body" -w '%{http_code}' \
                      "${base}/containers/${CONTAINER_ID}" || true)"
                    if [ "$verify_code" = "401" ]; then
                      fetch_token
                      verify_code="$(curl -sS \
                        -H "Authorization: Bearer ${TOKEN}" \
                        -H "Accept: application/json" \
                        -H "X-KIE-Server-Id: ${id}" \
                        -H "KIE-Server-Id: ${id}" \
                        -o "$verify_body" -w '%{http_code}' \
                        "${base}/containers/${CONTAINER_ID}" || true)"
                    fi
                  else
                    verify_code="$(curl -sS -u "${KIE_SERVER_REST_USER}:${KIE_SERVER_REST_PASS}" \
                      -H "Accept: application/json" \
                      -H "X-KIE-Server-Id: ${id}" \
                      -H "KIE-Server-Id: ${id}" \
                      -o "$verify_body" -w '%{http_code}' \
                      "${base}/containers/${CONTAINER_ID}" || true)"
                  fi
                  verify_json="$(cat "$verify_body" 2>/dev/null || true)"
                  rm -f "$verify_body"
                  verify_type="$(printf '%s' "$verify_json" | jq -r '.type // empty' 2>/dev/null || true)"
                  verify_version="$(printf '%s' "$verify_json" | jq -r '.result["kie-container"]["release-id"].version // .result["kie-container"]["resolved-release-id"].version // empty' 2>/dev/null || true)"
                  verify_msg="$(printf '%s' "$verify_json" | jq -r '.msg // empty' 2>/dev/null || true)"

                  if [ "$verify_code" = "200" ] && [ "$verify_type" = "SUCCESS" ] && [ "$verify_version" = "$VERSION" ]; then
                    echo "OK: KIE server ${id} deployed container ${CONTAINER_ID} version ${verify_version}"
                    break
                  fi

                  now="$(date +%s)"
                  if [ $((now - verify_start)) -ge "$KIE_SERVER_REST_WAIT_SECONDS" ]; then
                    echo "ERROR: Verification failed on ${id} after ${KIE_SERVER_REST_WAIT_SECONDS}s (HTTP ${verify_code}, type=${verify_type:-?}, version=${verify_version:-?}, expected=${VERSION})"
                    printf '%s\n' "$verify_json" | head -c 2000 || true
                    echo
                    return 1
                  fi

                  if [ "$verify_code" = "200" ] && [ "$verify_type" = "FAILURE" ] && printf '%s' "$verify_msg" | grep -qi "not instantiated"; then
                    echo "Waiting for container ${CONTAINER_ID} to instantiate on ${id}..."
                    sleep "$KIE_SERVER_REST_WAIT_INTERVAL"
                    continue
                  fi

                  echo "ERROR: Verification failed on ${id} (HTTP ${verify_code}, type=${verify_type:-?}, version=${verify_version:-?}, expected=${VERSION})"
                  printf '%s\n' "$verify_json" | head -c 2000 || true
                  echo
                  return 1
                done
              }
              if is_true "${DEPLOY_TO_KIE_SERVER_REST}"; then
                case "${KIE_SERVER_REST_AUTH_MODE}" in
                  bearer) ;;
                  basic) fetch_kie_server_rest_creds "$KIE_SERVER_REST_CREDS_PATH" ;;
                  *)
                    echo "ERROR: KIE_SERVER_REST_AUTH_MODE must be 'bearer' or 'basic' (got: ${KIE_SERVER_REST_AUTH_MODE})"
                    exit 1
                    ;;
                esac
              fi

              for KIE_SERVER_ID in $TARGET_SERVER_IDS; do
                echo "----- Registering container for KIE server ${KIE_SERVER_ID} -----"
                DELETE_BEFORE_REGISTER="false"
                DO_CONTROLLER_REGISTRATION="true"

              echo "Checking controller registration for KIE server ${KIE_SERVER_ID}..."
              CONTROLLER_HAS_SERVER="false"
              WAIT_START="$(date +%s)"
              while true; do
                fetch_servers
                if [ "$SERVERS_CODE" = "200" ] && printf '%s' "$SERVERS_JSON" | jq -e --arg id "$KIE_SERVER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  if type=="array" then
                    any(.[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  else
                    any(templates[]; (.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  end' >/dev/null 2>&1; then
                  CONTROLLER_HAS_SERVER="true"
                  echo "KIE server ${KIE_SERVER_ID} registered with controller"
                  break
                fi
                now="$(date +%s)"
                if [ $((now - WAIT_START)) -ge "$KIE_SERVER_WAIT_SECONDS" ]; then
                  if [ "${DEPLOY_TO_KIE_SERVER_REST}" = "true" ]; then
                    echo "WARN: KIE server ${KIE_SERVER_ID} not registered with controller after ${KIE_SERVER_WAIT_SECONDS}s; continuing because DEPLOY_TO_KIE_SERVER_REST=true"
                    break
                  fi
                  echo "ERROR: KIE server ${KIE_SERVER_ID} not registered after ${KIE_SERVER_WAIT_SECONDS}s (last HTTP ${SERVERS_CODE})"
                  exit 1
                fi
                echo "KIE server not registered yet (HTTP ${SERVERS_CODE}); retrying in ${KIE_SERVER_WAIT_INTERVAL}s..."
                sleep "$KIE_SERVER_WAIT_INTERVAL"
              done
              if [ "$CONTROLLER_HAS_SERVER" != "true" ]; then
                DO_CONTROLLER_REGISTRATION="false"
              fi

              echo "Checking controller server list..."
              echo "Servers response HTTP ${SERVERS_CODE}"
              printf '%s' "$SERVERS_JSON" | head -c 600 || true
              echo
              if [ "$SERVERS_CODE" = "200" ] && [ "$CONTROLLER_HAS_SERVER" = "true" ]; then
                CONTAINER_STATUS_FOUND="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" --arg cid "$CONTAINER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                    | .["container-specs"][]?
                    | select((.containerId // .["container-id"] // .id) == $cid)
                    | .status][0] // empty' 2>/dev/null || true)"
                CONTAINER_VERSION_FOUND="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" --arg cid "$CONTAINER_ID" '
                  def templates:
                    if type=="object" then
                      (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                    else [] end;
                  [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                    | .["container-specs"][]?
                    | select((.containerId // .["container-id"] // .id) == $cid)
                    | .["release-id"].version][0] // empty' 2>/dev/null || true)"
                if [ -n "$CONTAINER_STATUS_FOUND" ]; then
                  if [ -n "$CONTAINER_VERSION_FOUND" ]; then
                    echo "Container already registered with status: ${CONTAINER_STATUS_FOUND}, version: ${CONTAINER_VERSION_FOUND}"
                  else
                    echo "Container already registered with status: ${CONTAINER_STATUS_FOUND}"
                  fi
                  if [ "$CONTAINER_STATUS_FOUND" = "$CONTAINER_STATUS" ] && [ "$CONTAINER_VERSION_FOUND" = "$VERSION" ]; then
                    if [ "${FORCE_REDEPLOY}" = "true" ]; then
                      echo "Container matches desired version/status, but FORCE_REDEPLOY=true; redeploying."
                      DELETE_BEFORE_REGISTER="true"
                    else
                      echo "Container spec already matches desired version/status in controller; skipping controller registration."
                      DO_CONTROLLER_REGISTRATION="false"
                    fi
                  else
                    echo "Container version/status differs; updating registration."
                    if [ "${CLEANUP_OLD_VERSIONS}" = "true" ] || [ "${FORCE_REDEPLOY}" = "true" ]; then
                      DELETE_BEFORE_REGISTER="true"
                    fi
                  fi
                fi
              elif [ "$SERVERS_CODE" = "200" ]; then
                echo "WARN: Skipping controller container-spec checks because KIE server ${KIE_SERVER_ID} is not registered with the controller"
              fi

              if [ "$DO_CONTROLLER_REGISTRATION" = "true" ]; then
              CONTAINER_NAME="${CONTAINER_NAME:-$CONTAINER_ID}"
              SERVER_TEMPLATE_NAME="$(printf '%s' "$SERVERS_JSON" | jq -r --arg id "$KIE_SERVER_ID" '
                def templates:
                  if type=="object" then
                    (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                  else [] end;
                [templates[] | select((.serverId // .["server-id"] // .id // .["server_id"]) == $id)
                  | (.serverName // .["server-name"] // .name)] | .[0] // empty' 2>/dev/null || true)"
              if [ -z "$SERVER_TEMPLATE_NAME" ]; then
                SERVER_TEMPLATE_NAME="$KIE_SERVER_ID"
              fi

              CONTAINER_ENDPOINT="${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
              EXISTING_HEADERS="$(mktemp)"
              EXISTING_BODY_FILE="$(mktemp)"
              EXISTING_SPEC_CODE="$(curl -sS -D "$EXISTING_HEADERS" -o "$EXISTING_BODY_FILE" -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/json" \
                "$CONTAINER_ENDPOINT" || true)"
              EXISTING_SPEC_JSON="$(cat "$EXISTING_BODY_FILE")"
              log_http_response "GET" "$CONTAINER_ENDPOINT" "$EXISTING_SPEC_CODE" "$EXISTING_HEADERS" "$EXISTING_BODY_FILE"
              rm -f "$EXISTING_HEADERS" "$EXISTING_BODY_FILE"

              if [ "$EXISTING_SPEC_CODE" = "200" ] && [ -n "$EXISTING_SPEC_JSON" ]; then
                if printf '%s' "$EXISTING_SPEC_JSON" | jq -e 'has("container-spec")' >/dev/null 2>&1; then
                  payload="$(printf '%s' "$EXISTING_SPEC_JSON" | jq -c --arg ver "$VERSION" --arg status "$CONTAINER_STATUS" '
                    .["container-spec"]["release-id"].version = $ver
                    | .["container-spec"].status = $status
                  ')"
                else
                  payload="$(printf '%s' "$EXISTING_SPEC_JSON" | jq -c --arg ver "$VERSION" --arg status "$CONTAINER_STATUS" '
                    .["release-id"].version = $ver
                    | .status = $status
                  ')"
                fi
                echo "Using existing container spec from controller"
              else
                payload="$(jq -n \
                  --arg cid "$CONTAINER_ID" \
                  --arg cname "$CONTAINER_NAME" \
                  --arg gid "$GROUP_ID" \
                  --arg aid "$ARTIFACT_ID" \
                  --arg ver "$VERSION" \
                  --arg status "$CONTAINER_STATUS" \
                  --arg sid "$KIE_SERVER_ID" \
                  --arg sname "$SERVER_TEMPLATE_NAME" \
                  '{ "container-id": $cid, "container-name": $cname, "server-template-key": { "server-id": $sid, "server-name": $sname }, "release-id": { "group-id": $gid, "artifact-id": $aid, "version": $ver }, "status": $status, "configuration": {} }')"
                echo "Using generated container spec payload"
              fi

              payload="$(printf '%s' "$payload" | jq -c \
                --arg cname "$CONTAINER_NAME" \
                --arg sid "$KIE_SERVER_ID" \
                --arg sname "$SERVER_TEMPLATE_NAME" '
                if has("container-spec") then
                  .["container-spec"]["container-name"] = $cname
                  | .["container-spec"]["server-template-key"] = {"server-id": $sid, "server-name": $sname}
                else
                  .["container-name"] = $cname
                  | .["server-template-key"] = {"server-id": $sid, "server-name": $sname}
                end
              ')"
              echo "Payload: ${payload}"

              echo "Registering container ${CONTAINER_ID} -> ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"
              echo "Registering via bearer token"
              RESPONSE_FILE="$(mktemp)"
              RESPONSE_HEADERS="$(mktemp)"
              register_request() {
                method="$1"
                url="$2"
                ensure_token
                code="$(curl -sS -D "$RESPONSE_HEADERS" -o "$RESPONSE_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -H "X-KIE-ContentType: JSON" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -X "$method" "$url" \
                  --data-binary "${payload}" || true)"
                if [ "$code" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  code="$(curl -sS -D "$RESPONSE_HEADERS" -o "$RESPONSE_FILE" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -H "X-KIE-ContentType: JSON" \
                    -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -X "$method" "$url" \
                    --data-binary "${payload}" || true)"
                fi
                log_http_response "$method" "$url" "$code" "$RESPONSE_HEADERS" "$RESPONSE_FILE"
                echo "$code"
              }
              print_allow() {
                url="$1"
                echo "Allowed methods for ${url}:" >&2
                curl -sS -D - -o /dev/null -X OPTIONS \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  "$url" | awk -F': ' 'tolower($1)=="allow"{print $2}' | tr -d '\r' >&2 || true
              }

              register_container() {
                HTTP_CODE="$(register_request POST "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}")"
                if [ "$HTTP_CODE" = "405" ] || [ "$HTTP_CODE" = "404" ]; then
                  echo "Controller did not accept POST /management/servers/.../containers/{id}; trying PUT" >&2
                  print_allow "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
                  HTTP_CODE="$(register_request PUT "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}")"
                fi
                echo "$HTTP_CODE"
              }

              delete_container_spec() {
                url="${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}"
                ensure_token
                del_headers="$(mktemp)"
                del_body="$(mktemp)"
                code="$(curl -sS -D "$del_headers" -o "$del_body" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  -H "X-KIE-ContentType: JSON" \
                  -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                  -X DELETE "$url" || true)"
                if [ "$code" = "401" ]; then
                  echo "Token rejected by controller; refreshing token and retrying." >&2
                  fetch_token
                  code="$(curl -sS -D "$del_headers" -o "$del_body" -w "%{http_code}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Accept: application/json" \
                    -H "X-KIE-ContentType: JSON" \
                    -H "X-KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -H "KIE-Server-Id: ${KIE_SERVER_ID}" \
                    -X DELETE "$url" || true)"
                fi
                log_http_response "DELETE" "$url" "$code" "$del_headers" "$del_body"
                rm -f "$del_headers" "$del_body"
                echo "Delete ${url} -> HTTP ${code}" >&2
                case "$code" in
                  200|204|404) return 0 ;;
                esac
                return 1
              }

              if [ "${DELETE_BEFORE_REGISTER}" = "true" ]; then
                echo "Deleting existing container spec before registration."
                delete_container_spec || echo "Warning: delete container spec did not succeed" >&2
              fi

              HTTP_CODE="$(register_container)"
              if [ "$HTTP_CODE" = "500" ]; then
                echo "Controller returned HTTP 500; attempting delete + recreate"
                delete_container_spec || echo "Warning: delete container spec did not succeed" >&2
                HTTP_CODE="$(register_container)"
              fi

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK: Container registered"
              elif [ "$HTTP_CODE" = "409" ]; then
                echo "OK: Container already registered"
              else
                echo "ERROR: Workbench controller returned HTTP ${HTTP_CODE}"
                echo "Response headers:"
                cat "$RESPONSE_HEADERS"
                echo "Response body:"
                cat "$RESPONSE_FILE"
                rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
                exit 1
              fi

              ensure_token
              VERIFY_HEADERS="$(mktemp)"
              VERIFY_BODY_FILE="$(mktemp)"
              VERIFY_CODE="$(curl -sS -D "$VERIFY_HEADERS" -o "$VERIFY_BODY_FILE" -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/json" \
                "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" || true)"
              VERIFY_JSON="$(cat "$VERIFY_BODY_FILE")"
              if [ "$VERIFY_CODE" = "401" ]; then
                echo "Token rejected by controller; refreshing token and retrying." >&2
                fetch_token
                VERIFY_CODE="$(curl -sS -D "$VERIFY_HEADERS" -o "$VERIFY_BODY_FILE" -w "%{http_code}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" || true)"
                VERIFY_JSON="$(cat "$VERIFY_BODY_FILE")"
              fi
              log_http_response "GET" "${WORKBENCH_CONTROLLER_URL}/management/servers/${KIE_SERVER_ID}/containers/${CONTAINER_ID}" "$VERIFY_CODE" "$VERIFY_HEADERS" "$VERIFY_BODY_FILE"
              rm -f "$VERIFY_HEADERS" "$VERIFY_BODY_FILE"
              if [ "$VERIFY_CODE" = "200" ]; then
                VERIFY_VERSION="$(printf '%s' "$VERIFY_JSON" | jq -r '.["release-id"].version // .["container-spec"]["release-id"].version // empty' 2>/dev/null || true)"
                if [ -n "$VERIFY_VERSION" ]; then
                  echo "Controller reports container version: ${VERIFY_VERSION}"
                fi
                if [ "$VERIFY_VERSION" != "$VERSION" ]; then
                  echo "ERROR: Controller version ${VERIFY_VERSION} does not match expected ${VERSION}"
                  rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
                  exit 1
                fi
              else
                echo "WARNING: Could not verify container spec (HTTP ${VERIFY_CODE})" >&2
              fi
              rm -f "$RESPONSE_FILE" "$RESPONSE_HEADERS"
              else
                echo "Skipping controller registration for ${KIE_SERVER_ID}"
              fi
              if is_true "${DEPLOY_TO_KIE_SERVER_REST}"; then
                deploy_container_via_kie_rest "${KIE_SERVER_ID}"
              fi
              done
