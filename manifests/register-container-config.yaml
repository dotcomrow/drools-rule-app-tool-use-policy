apiVersion: v1
kind: ConfigMap
metadata:
  name: register-container-config-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  WORKBENCH_CONTROLLER_URL: "http://kie-workbench.drools.svc.cluster.local:8080/business-central/rest/controller"
  REPO_URL: "https://github.com/dotcomrow/drools-rule-app-tool-use-policy.git"
  REPO_BRANCH: "prod"
  MAVEN_REPO_URL: "https://maven.pkg.github.com/dotcomrow/drools-rule-app-tool-use-policy"
  KIE_SERVER_ID: "auto"
  KIE_SERVER_ID_PREFIX: "kie-server-"
  KIE_SERVER_MIN_COUNT: "2"
  CONTAINER_ID: "tool-use-policy"
  GROUP_ID: "com.dotcomrow.rules"
  ARTIFACT_ID: "tool-use-policy"
  VERSION: "1.0.157"
  VERSION_PREFIX: ""
  REQUIRE_PUBLISHED_VERSION: "true"
  FALLBACK_TO_LATEST_PUBLISHED: "false"
  PUBLISHED_VERSION_WAIT_SECONDS: "1200"
  PUBLISHED_VERSION_POLL_SECONDS: "15"
  CLEANUP_OLD_VERSIONS: "true"
  FORCE_REDEPLOY: "false"
  CONTAINER_STATUS: "STARTED"
  DEPLOY_TO_KIE_SERVER_REST: "true"
  # If set, overrides headless service + namespace composition. Use "{id}" placeholder for the KIE server id.
  # Example: "http://{id}.kie-server-headless.drools.svc.cluster.local:8080/kie-server/services/rest/server"
  KIE_SERVER_REST_BASE_URL_TEMPLATE: ""
  KIE_SERVER_REST_SCHEME: "http"
  KIE_SERVER_REST_HEADLESS_SERVICE: "kie-server-headless"
  KIE_SERVER_REST_NAMESPACE: "drools"
  KIE_SERVER_REST_PORT: "8080"
  KIE_SERVER_REST_CONTEXT_PATH: "/kie-server/services/rest/server"
  # Vault KV path with username/password for KIE server REST calls.
  KIE_SERVER_REST_CREDS_PATH: "secret/drools/admin"
  KIE_SERVER_REST_WAIT_SECONDS: "900"
  KIE_SERVER_REST_WAIT_INTERVAL: "5"
  LOG_HTTP: "true"
  LOG_HTTP_ONLY_ERRORS: "false"
  LOG_HTTP_BODY_MAX: "8000"
