apiVersion: v1
kind: ConfigMap
metadata:
  name: register-container-config-tool-use-policy
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  WORKBENCH_CONTROLLER_URL: "http://kie-workbench.drools.svc.cluster.local:8080/business-central/rest/controller"
  REPO_URL: "https://github.com/dotcomrow/drools-rule-app-tool-use-policy.git"
  REPO_BRANCH: "prod"
  MAVEN_REPO_URL: "https://maven.pkg.github.com/dotcomrow/drools-rule-app-tool-use-policy"
  KIE_SERVER_ID: "auto"
  KIE_SERVER_ID_PREFIX: "kie-server-"
  KIE_SERVER_MIN_COUNT: "2"
  CONTAINER_ID: "tool-use-policy"
  GROUP_ID: "com.dotcomrow.rules"
  ARTIFACT_ID: "tool-use-policy"
  VERSION: "1.0.153"
  VERSION_PREFIX: ""
  REQUIRE_PUBLISHED_VERSION: "true"
  FALLBACK_TO_LATEST_PUBLISHED: "false"
  PUBLISHED_VERSION_WAIT_SECONDS: "1200"
  PUBLISHED_VERSION_POLL_SECONDS: "15"
  CLEANUP_OLD_VERSIONS: "true"
  FORCE_REDEPLOY: "false"
  CONTAINER_STATUS: "STARTED"
  LOG_HTTP: "true"
  LOG_HTTP_ONLY_ERRORS: "false"
  LOG_HTTP_BODY_MAX: "8000"
